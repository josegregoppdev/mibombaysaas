<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${ingrediente.id} ? 'Editar ingrediente' : 'Nuevo ingrediente'">Ingrediente - MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="mb-dashboard-header">
                    <h1 class="display-6" th:text="${ingrediente.id} ? 'Editar ingrediente' : 'Nuevo ingrediente'">Título</h1>
                    <p class="lead text-muted">Complete los campos del formulario</p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="${ingrediente.id} ? @{/ingrediente/{id}(id=${ingrediente.id})} : @{/ingrediente}"
                              th:object="${ingrediente}" method="post" class="needs-validation">

                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label for="codigo" class="form-label">Código</label>
                                    <input type="text" class="form-control" id="codigo"
                                           th:field="*{codigo}"
                                           th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'"
                                           placeholder="Ej: CAR-001">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('codigo')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-md-8">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre"
                                           th:field="*{nombre}"
                                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                                           placeholder="Ej: Carne de res">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('nombre')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-12">
                                    <label for="descripcion" class="form-label">Descripción</label>
                                    <textarea class="form-control" id="descripcion" rows="2"
                                              th:field="*{descripcion}"
                                              th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"
                                              placeholder="Descripción opcional"></textarea>
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('descripcion')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-md-4">
                                    <label for="categoria" class="form-label">Categoría</label>
                                    <select class="form-select" id="categoria" th:field="*{categoria}">
                                        <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat.displayName}">Categoría</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label for="unidadMedida" class="form-label">Unidad de medida</label>
                                    <select class="form-select" id="unidadMedida" th:field="*{unidadMedida}"
                                            th:classappend="${#fields.hasErrors('unidadMedida')} ? 'is-invalid'">
                                        <option th:each="um : ${T(com.josegregoppdev.mibombay.model.ingrediente.UnidadMedida).values()}"
                                                th:value="${um}" th:text="${um}">UNIDAD</option>
                                    </select>
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('unidadMedida')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-md-4">
                                    <label for="costoUnitarioActual" class="form-label">Costo unitario</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999" class="form-control" id="costoUnitarioActual"
                                           th:field="*{costoUnitarioActual}"
                                           th:classappend="${#fields.hasErrors('costoUnitarioActual')} ? 'is-invalid'"
                                           placeholder="0.00">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('costoUnitarioActual')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-md-4">
                                    <label for="stockActual" class="form-label">Stock actual</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999" class="form-control" id="stockActual"
                                           th:field="*{stockActual}"
                                           th:classappend="${#fields.hasErrors('stockActual')} ? 'is-invalid'"
                                           placeholder="0">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('stockActual')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-md-4">
                                    <label for="stockMinimo" class="form-label">Stock mínimo</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999" class="form-control" id="stockMinimo"
                                           th:field="*{stockMinimo}"
                                           th:classappend="${#fields.hasErrors('stockMinimo')} ? 'is-invalid'"
                                           placeholder="0">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('stockMinimo')}" th:text="${err}">Error</div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-2"></i>
                                    <span th:text="${ingrediente.id} ? 'Actualizar' : 'Crear'">Guardar</span>
                                </button>
                                <a th:href="@{/ingrediente}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-lg me-2"></i>Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
