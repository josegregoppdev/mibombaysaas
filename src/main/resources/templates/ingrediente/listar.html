<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredientes - MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${mensaje}">Mensaje</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="display-6">Ingredientes</h1>
                        <p class="lead text-muted">Gestiona los ingredientes del inventario</p>
                    </div>
                    <a th:href="@{/ingrediente/nuevo}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-2"></i>Nuevo ingrediente
                    </a>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Código</th>
                                        <th>Nombre</th>
                                        <th>Categoría</th>
                                        <th>Unidad</th>
                                        <th>Costo</th>
                                        <th>Stock</th>
                                        <th>Estado</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="ing : ${pagina.content}">
                                        <td><code th:text="${ing.codigo}">COD</code></td>
                                        <td th:text="${ing.nombre}" class="fw-medium">Nombre</td>
                                        <td th:text="${ing.categoria?.displayName ?: '—'}">Categoría</td>
                                        <td th:text="${ing.unidadMedida}">UNIDAD</td>
                                        <td th:text="${ing.costoUnitarioActual}">0.00</td>
                                        <td th:text="${ing.stockActual}">0</td>
                                        <td>
                                            <span th:if="${ing.activo}" class="badge bg-success">Activo</span>
                                            <span th:unless="${ing.activo}" class="badge bg-danger">Inactivo</span>
                                        </td>
                                        <td class="text-end">
                                            <a th:href="@{/ingrediente/{id}/editar(id=${ing.id})}" class="btn btn-sm btn-outline-primary me-1">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:if="${ing.activo}" th:action="@{/ingrediente/{id}/desactivar(id=${ing.id})}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Desactivar este ingrediente?')">
                                                    <i class="bi bi-x-circle"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${pagina.totalElements == 0}">
                                        <td colspan="8" class="text-center text-muted py-4">
                                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                            No hay ingredientes registrados
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <nav th:if="${pagina.totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/ingrediente(page=0)}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
                            th:classappend="${i == pagina.number} ? 'active'">
                            <a class="page-link" th:href="@{/ingrediente(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/ingrediente(page=${pagina.totalPages - 1})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
