<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                    <div>
                        <h1 class="display-6">Customers</h1>
                        <p class="text-muted mb-0">Manage customer registry</p>
                    </div>
                    <a th:href="@{/customer/new}" class="btn btn-primary">
                        <i class="bi bi-plus-lg"></i>New customer
                    </a>
                </div>

                <!-- Filter Card -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <form th:action="@{/customer}" method="get" class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label" for="filterName">Name</label>
                                <input type="text" class="form-control" id="filterName" name="name"
                                       th:value="${name}" placeholder="Search by name...">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="filterDocument">Document</label>
                                <input type="text" class="form-control" id="filterDocument" name="document"
                                       th:value="${document}" placeholder="Search by document...">
                            </div>
                            <div class="col-md-4 d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-fill">
                                    <i class="bi bi-search"></i>Filter
                                </button>
                                <a th:href="@{/customer}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-lg"></i>
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Name</th>
                                        <th>Document</th>
                                        <th>Phone</th>
                                        <th>Address</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cust : ${page.content}">
                                        <td class="fw-medium">
                                            <span th:text="${cust.fullName}">Name</span>
                                            <span th:if="${cust.isDefault}" class="badge bg-secondary ms-1">Default</span>
                                        </td>
                                        <td th:text="${cust.documentMasked}">Document</td>
                                        <td th:text="${cust.phoneMasked}">Phone</td>
                                        <td th:text="${cust.address ?: '\u2014'}">Address</td>
                                        <td>
                                            <span th:if="${cust.active}" class="badge bg-success">Active</span>
                                            <span th:unless="${cust.active}" class="badge bg-danger">Inactive</span>
                                        </td>
                                        <td class="text-end">
                                            <a th:if="${!cust.isDefault}" th:href="@{/customer/{id}/edit(id=${cust.id})}"
                                               class="btn btn-sm btn-outline-primary me-1">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:if="${!cust.isDefault}" th:action="@{/customer/{id}/toggle-status(id=${cust.id})}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm"
                                                        th:classappend="${cust.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                        onclick="return confirm('Change status of this customer?')">
                                                    <i th:if="${cust.active}" class="bi bi-x-circle"></i>
                                                    <i th:unless="${cust.active}" class="bi bi-check-circle"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.totalElements == 0}">
                                        <td colspan="6" class="mb-empty">
                                            <i class="bi bi-people"></i>
                                            <p class="fw-medium mt-2">No customers registered</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav th:if="${page.totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/customer(page=0, name=${name}, document=${document})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                            th:classappend="${i == page.number} ? 'active'">
                            <a class="page-link" th:href="@{/customer(page=${i}, name=${name}, document=${document})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/customer(page=${page.totalPages - 1}, name=${name}, document=${document})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
