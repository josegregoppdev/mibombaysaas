<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-auth">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <main class="mb-main py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="text-center mb-4">
                        <h1 class="display-6">Create your company</h1>
                        <p class="text-muted">Complete the data to start using MiBombay</p>
                    </div>
                    
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">Error</span>
                    </div>
                    
                    <form th:action="@{/registration}" th:object="${companyRequest}" method="post">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="card shadow-sm border-0 h-100">
                                    <div class="card-body p-4">
                                        <h5 class="card-title mb-4">
                                            <i class="bi bi-building text-primary me-2"></i>
                                            Company data
                                        </h5>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" th:field="*{name}" 
                                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" 
                                                   id="name" placeholder="My Restaurant" required>
                                            <label for="name">Company name *</label>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                        </div>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" th:field="*{subdomain}" 
                                                   th:classappend="${#fields.hasErrors('subdomain')} ? 'is-invalid'" 
                                                   id="subdomain" placeholder="my-restaurant" required
                                                   pattern="^[a-z0-9-]+$">
                                            <label for="subdomain">Subdomain *</label>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('subdomain')}" th:errors="*{subdomain}"></div>
                                            <small class="form-text text-muted">Only lowercase letters, numbers, and hyphens (3-60 characters)</small>
                                        </div>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="email" class="form-control" th:field="*{email}" 
                                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" 
                                                   id="email" placeholder="contact@company.com" required>
                                            <label for="email">Contact email *</label>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                        </div>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="tel" class="form-control" th:field="*{phone}" 
                                                   id="phone" placeholder="+54 11 1234-5678">
                                            <label for="phone">Phone</label>
                                        </div>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" th:field="*{address}" 
                                                   th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'" 
                                                   id="address" placeholder="123 Main St" required>
                                            <label for="address">Address *</label>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="card shadow-sm border-0 h-100">
                                    <div class="card-body p-4">
                                        <h5 class="card-title mb-4">
                                            <i class="bi bi-person-badge text-primary me-2"></i>
                                            Manager data
                                        </h5>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" th:field="*{managerName}" 
                                                   th:classappend="${#fields.hasErrors('managerName')} ? 'is-invalid'" 
                                                   id="managerName" placeholder="John Doe" required>
                                            <label for="managerName">Full name *</label>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('managerName')}" th:errors="*{managerName}"></div>
                                        </div>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="email" class="form-control" th:field="*{managerEmail}" 
                                                   th:classappend="${#fields.hasErrors('managerEmail')} ? 'is-invalid'" 
                                                   id="managerEmail" placeholder="john@company.com" required>
                                            <label for="managerEmail">Email (will be your username) *</label>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('managerEmail')}" th:errors="*{managerEmail}"></div>
                                        </div>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="tel" class="form-control" th:field="*{managerPhone}" 
                                                   id="managerPhone" placeholder="+54 11 9876-5432">
                                            <label for="managerPhone">Phone</label>
                                        </div>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" th:field="*{managerDocument}" 
                                                   th:classappend="${#fields.hasErrors('managerDocument')} ? 'is-invalid'" 
                                                   id="managerDocument" placeholder="12345678" required>
                                            <label for="managerDocument">Document/ID *</label>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('managerDocument')}" th:errors="*{managerDocument}"></div>
                                        </div>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="password" class="form-control" th:field="*{managerPassword}" 
                                                   th:classappend="${#fields.hasErrors('managerPassword')} ? 'is-invalid'" 
                                                   id="managerPassword" placeholder="Password" required minlength="8">
                                            <label for="managerPassword">Password *</label>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('managerPassword')}" th:errors="*{managerPassword}"></div>
                                            <small class="form-text text-muted">Minimum 8 characters</small>
                                        </div>
                                        
                                        <div class="form-floating mb-3">
                                            <input type="password" class="form-control" th:field="*{confirmManagerPassword}" 
                                                   th:classappend="${#fields.hasErrors('confirmManagerPassword')} ? 'is-invalid'" 
                                                   id="confirmManagerPassword" placeholder="Confirm password" required>
                                            <label for="confirmManagerPassword">Confirm password *</label>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmManagerPassword')}" th:errors="*{confirmManagerPassword}"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-3 justify-content-center mt-4">
                            <button type="submit" class="btn btn-amber btn-lg">
                                <i class="bi bi-rocket-takeoff me-2"></i>Create company
                            </button>
                            <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
