<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchases — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="sd-fade" style="opacity:0">
                    <div class="sd-page-header">
                        <div>
                            <h1 class="sd-page-title">Purchases</h1>
                            <p class="sd-page-desc">All registered purchases</p>
                            <div class="sd-title-accent"></div>
                        </div>
                        <div class="sd-page-actions">
                            <a th:href="@{/purchase/new}" class="sd-btn">
                                <i class="bi bi-plus-circle"></i>New Purchase
                            </a>
                        </div>
                    </div>

                    <div class="sd-filter-form mb-3">
                        <form th:action="@{/purchase}" method="get" class="sd-filter-fields">
                            <div class="sd-filter-field">
                                <label class="sd-filter-label" for="filterSupplier"><i class="bi bi-truck"></i>Supplier</label>
                                <input type="text" class="sd-filter-input" id="filterSupplier" name="supplierName"
                                       th:value="${supplierName}" placeholder="Search supplier">
                            </div>
                            <div class="sd-filter-field">
                                <label class="sd-filter-label" for="filterFrom"><i class="bi bi-calendar2"></i>From</label>
                                <input type="date" class="sd-filter-input" id="filterFrom" name="from" th:value="${from}">
                            </div>
                            <div class="sd-filter-field">
                                <label class="sd-filter-label" for="filterTo"><i class="bi bi-calendar2"></i>To</label>
                                <input type="date" class="sd-filter-input" id="filterTo" name="to" th:value="${to}">
                            </div>
                            <div class="sd-filter-field">
                                <label class="sd-filter-label" for="filterActive"><i class="bi bi-circle-half"></i>Status</label>
                                <select class="sd-filter-input" id="filterActive" name="active">
                                    <option value="">All</option>
                                    <option value="true" th:selected="${active == true}">Active</option>
                                    <option value="false" th:selected="${active == false}">Cancelled</option>
                                </select>
                            </div>
                            <div class="sd-page-actions">
                                <button type="submit" class="sd-btn sd-btn--sm"><i class="bi bi-search"></i>Filter</button>
                                <a th:href="@{/purchase}" class="sd-btn sd-btn--outline sd-btn--sm"><i class="bi bi-x-lg"></i></a>
                            </div>
                        </form>
                    </div>

                    <div class="sd-list-card">
                        <div class="sd-list-card-glow"></div>
                        <div class="sa-table-wrapper">
                            <table class="sa-table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Date</th>
                                        <th>Supplier</th>
                                        <th>User</th>
                                        <th class="sa-cell-right">Total</th>
                                        <th>Status</th>
                                        <th class="sa-cell-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="p : ${page.content}" class="sd-table-row">
                                        <td th:text="${p.id}">1</td>
                                        <td th:text="${#temporals.format(p.purchaseDate, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                                        <td th:text="${p.supplierName}">Supplier</td>
                                        <td th:text="${p.userName ?: '\u2014'}">User</td>
                                        <td class="sa-cell-right" th:text="'$' + ${#numbers.formatDecimal(p.total, 1, 2)}">$0.00</td>
                                        <td>
                                            <span class="sa-badge" th:classappend="${p.active} ? 'sa-badge--success' : 'sa-badge--danger'"
                                                  th:text="${p.active} ? 'Active' : 'Cancelled'">Active</span>
                                        </td>
                                        <td class="sa-cell-center">
                                            <a th:href="@{/purchase/{id}(id=${p.id})}" class="sa-btn-icon" title="View details">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${page == null or #lists.isEmpty(page.content)}">
                                        <td colspan="7">
                                            <div class="sd-empty">
                                                <div class="sd-empty-icon"><i class="bi bi-cart-check"></i></div>
                                                <h3>No purchases registered</h3>
                                                <p>Register the first purchase from the suppliers.</p>
                                                <a th:href="@{/purchase/new}" class="sd-btn">
                                                    <i class="bi bi-plus-circle"></i>New Purchase
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="sd-pagination" th:if="${page != null and page.totalPages > 1}">
                        <div class="sd-pagination-info">
                            Page <span th:text="${page.number + 1}">1</span> of <span th:text="${page.totalPages}">1</span>
                            (<span th:text="${page.totalElements}">0</span> results)
                        </div>
                        <div class="sd-pagination-links">
                            <a th:href="@{/purchase(page=${page.number - 1}, supplierName=${supplierName}, from=${from}, to=${to}, active=${active})}"
                               class="sd-page-link" th:classappend="${page.first} ? 'sd-page-link--disabled' : ''">
                                <i class="bi bi-chevron-left"></i>Prev
                            </a>
                            <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                                <a th:href="@{/purchase(page=${i}, supplierName=${supplierName}, from=${from}, to=${to}, active=${active})}"
                                   class="sd-page-link" th:classappend="${i == page.number} ? 'sd-page-link--active' : ''"
                                   th:text="${i + 1}">1</a>
                            </span>
                            <a th:href="@{/purchase(page=${page.number + 1}, supplierName=${supplierName}, from=${from}, to=${to}, active=${active})}"
                               class="sd-page-link" th:classappend="${page.last} ? 'sd-page-link--disabled' : ''">
                                Next <i class="bi bi-chevron-right"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.sd-fade').forEach(function(el, i) {
                setTimeout(function() {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 80 * i);
            });
        });
    </script>
</body>
</html>
