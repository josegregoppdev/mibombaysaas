<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Purchase — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .sd-pos-page {
            display: flex; flex-direction: column;
            height: calc(100vh - var(--mb-nav-height) - 4rem);
            min-height: 500px;
            margin-top: 1rem;
        }
        .sd-pos-layout { display: flex; flex: 1; overflow: hidden; border-radius: var(--mb-radius-lg); border: 1px solid var(--mb-border-light); }

        .sd-pos-products { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--mb-bg); min-width: 0; }
        .sd-pos-search { padding: 0.6rem 0.75rem; display: flex; align-items: center; border-bottom: 1px solid var(--mb-border-light); background: #fff; position: relative; flex-shrink: 0; }
        .sd-pos-search i { position: absolute; left: 1.3rem; color: var(--mb-text-light); font-size: 0.85rem; }
        .sd-pos-search-input { width: 100%; padding: 0.45rem 0.75rem 0.45rem 2.3rem; border: 1.5px solid var(--mb-border-light); border-radius: var(--mb-radius-sm); font-size: 0.85rem; background: var(--mb-blue-50); min-height: 38px; }
        .sd-pos-search-input:focus { outline: none; border-color: var(--mb-blue-400); box-shadow: 0 0 0 0.15rem rgba(30,90,150,0.1); background: #fff; }

        .sd-pos-grid { flex: 1; overflow-y: auto; padding: 0.6rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; align-content: start; }
        .sd-pos-item { background: #fff; border: 1.5px solid var(--mb-border-light); border-radius: 10px; padding: 0.6rem 0.4rem; text-align: center; cursor: pointer; transition: all 0.12s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80px; position: relative; user-select: none; }
        .sd-pos-item:hover { border-color: var(--mb-blue-300); box-shadow: var(--mb-shadow); transform: translateY(-1px); }
        .sd-pos-item:active { transform: scale(0.96); }
        .sd-pos-item-icon { font-size: 1.5rem; margin-bottom: 0.15rem; line-height: 1; }
        .sd-pos-item-name { font-size: 0.78rem; font-weight: 600; color: var(--mb-text); margin-bottom: 0.05rem; line-height: 1.1; }
        .sd-pos-item-sub { font-size: 0.7rem; color: var(--mb-text-muted); }
        .sd-pos-item-price { font-size: 0.85rem; font-weight: 700; color: var(--mb-blue-700); }
        .sd-pos-item-badge { position: absolute; top: 5px; right: 5px; font-size: 0.55rem; background: var(--mb-amber-500); color: #fff; padding: 0.08rem 0.4rem; border-radius: 8px; font-weight: 700; letter-spacing: 0.03em; }

        .sd-pos-cart { width: 340px; background: var(--mb-blue-900); color: #E8ECF1; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
        .sd-pos-cart-header { padding: 0.6rem 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .sd-pos-cart-header-title { display: flex; align-items: center; gap: 0.4rem; font-weight: 600; font-size: 0.88rem; color: #fff; }
        .sd-pos-cart-count { background: var(--mb-amber-500); color: #1A1A1A; border-radius: 12px; padding: 0.08rem 0.5rem; font-size: 0.7rem; font-weight: 700; min-width: 22px; text-align: center; }
        .sd-pos-cart-clear { background: none; border: none; color: rgba(255,255,255,0.35); font-size: 1rem; cursor: pointer; padding: 0.25rem; border-radius: 6px; }
        .sd-pos-cart-clear:hover { color: var(--mb-error); background: rgba(230,57,70,0.12); }
        .sd-pos-cart-close { display: none; background: none; border: none; color: rgba(255,255,255,0.35); font-size: 1.1rem; cursor: pointer; padding: 0.25rem; border-radius: 6px; }
        .sd-pos-cart-close:hover { color: #fff; background: rgba(255,255,255,0.08); }

        .sd-pos-cart-items { flex: 1; overflow-y: auto; padding: 0.4rem 0.5rem; min-height: 100px; }
        .sd-pos-cart-empty { text-align: center; padding: 2.5rem 1rem; color: rgba(255,255,255,0.25); }
        .sd-pos-cart-empty i { font-size: 2.2rem; display: block; margin-bottom: 0.5rem; opacity: 0.4; }
        .sd-pos-cart-empty p { font-size: 0.8rem; margin: 0; }

        .sd-pos-cart-row { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 0.5rem; margin-bottom: 0.3rem; }
        .sd-pos-cart-row-name { font-size: 0.82rem; font-weight: 500; color: #fff; margin-bottom: 0.05rem; }
        .sd-pos-cart-row-price { font-size: 0.7rem; color: rgba(255,255,255,0.4); }
        .sd-pos-cart-row-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 0.4rem; gap: 0.4rem; }
        .sd-pos-cart-row-cost { display: flex; align-items: center; gap: 0.25rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 0 0.35rem; }
        .sd-pos-cart-row-cost-prefix { color: rgba(255,255,255,0.5); font-weight: 600; font-size: 0.8rem; }
        .sd-pos-cart-row-cost-input { width: 80px; background: transparent; border: none; color: #fff; font-size: 0.82rem; font-weight: 600; padding: 0.35rem 0; outline: none; min-width: 0; }
        .sd-pos-cart-row-cost-input:read-only { color: rgba(255,255,255,0.7); }
        .sd-pos-qty-group { display: flex; align-items: center; gap: 0.25rem; }
        .sd-pos-qty-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: all 0.15s; }
        .sd-pos-qty-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .sd-pos-qty-val { font-size: 0.8rem; font-weight: 600; color: #fff; min-width: 22px; text-align: center; }
        .sd-pos-cart-row-sub { font-size: 0.82rem; font-weight: 600; color: #fff; min-width: 60px; text-align: right; }
        .sd-pos-cart-row-del { background: none; border: none; color: rgba(255,255,255,0.3); font-size: 0.95rem; cursor: pointer; padding: 0.1rem 0.15rem; }
        .sd-pos-cart-row-del:hover { color: var(--mb-error); }

        .sd-pos-cart-footer { border-top: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; padding: 0.6rem 0.75rem 0.75rem; }
        .sd-pos-total { display: flex; align-items: baseline; justify-content: space-between; margin: 0.2rem 0 0.6rem; padding-top: 0.4rem; border-top: 1px dashed rgba(255,255,255,0.12); }
        .sd-pos-total-label { font-size: 0.78rem; color: rgba(255,255,255,0.5); font-weight: 500; }
        .sd-pos-total-val { font-size: 1.5rem; font-weight: 700; color: #fff; }

        .sd-pos-btn-pagar { width: 100%; padding: 0.7rem; border-radius: 10px; font-size: 0.92rem; font-weight: 700; background: var(--mb-success); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: 52px; box-shadow: 0 2px 10px rgba(42,157,143,0.35); transition: all 0.15s; letter-spacing: 0.02em; }
        .sd-pos-btn-pagar:hover:not(:disabled) { background: #249486; box-shadow: 0 4px 14px rgba(42,157,143,0.45); transform: translateY(-1px); }
        .sd-pos-btn-pagar:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

        .sd-pos-cart-fab { display: none; }
        @media (max-width: 767.98px) {
            .sd-pos-page { height: auto; min-height: 0; }
            .sd-pos-layout { flex-direction: column; overflow: visible; }
            .sd-pos-products { flex: none; overflow: visible; }
            .sd-pos-grid { flex: none; overflow: visible; grid-template-columns: repeat(3, 1fr); }
            .sd-pos-cart {
                position: fixed; top: var(--mb-nav-height); right: 0; bottom: 0;
                width: 88%; max-width: 360px; height: auto; max-height: none;
                transform: translateX(100%); transition: transform 0.28s ease; z-index: 1055;
                border-left: 1px solid rgba(255,255,255,0.08); box-shadow: -4px 0 20px rgba(0,0,0,0.35);
            }
            .sd-pos-cart.open { transform: translateX(0); }
            .sd-pos-cart-backdrop {
                position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1050;
                opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0.2s;
            }
            .sd-pos-cart-backdrop.open { opacity: 1; visibility: visible; }
            .sd-pos-cart-fab {
                display: flex; align-items: center; gap: 0.5rem; position: fixed; bottom: 1rem; right: 1rem;
                z-index: 1045; background: var(--mb-blue-900); color: #fff; border: none; border-radius: 50px;
                padding: 0.7rem 1.1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.3); font-weight: 600; cursor: pointer; min-height: 48px;
            }
            .sd-pos-cart-fab-count { background: var(--mb-amber-500); color: #1A1A1A; border-radius: 12px; padding: 0.1rem 0.5rem; font-size: 0.75rem; font-weight: 700; }
            .sd-pos-cart-fab-total { font-size: 0.9rem; }
        }
        @media (min-width: 992px) {
            .sd-pos-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 1400px) {
            .sd-pos-grid { grid-template-columns: repeat(4, 1fr); }
            .sd-pos-cart { width: 380px; }
        }
    </style>
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col" style="padding:1.5rem">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center mb-0 gap-2">
                    <div>
                        <h1 class="sd-page-title">New Purchase</h1>
                        <p class="sd-page-desc">Register the purchase of ingredients and finished products</p>
                        <div class="sd-title-accent"></div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label mb-1" for="supplierSelect">Supplier</label>
                        <select class="form-select" id="supplierSelect">
                            <option value="" th:unless="${!suppliers.isEmpty()}" disabled>No active suppliers</option>
                            <option th:each="s : ${suppliers}" th:value="${s.id}"
                                    th:text="${s.name} + (${s.isDefault} ? ' (default)' : '')"
                                    th:selected="${s.isDefault}">Supplier</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label mb-1" for="purchaseDate">Purchase date</label>
                        <input type="date" class="form-control" id="purchaseDate" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label mb-1" for="observations">Observations</label>
                        <input type="text" class="form-control" id="observations" placeholder="Optional note...">
                    </div>
                </div>

                <div class="sd-pos-page mt-0">
                    <div class="sd-pos-layout">
                        <div class="sd-pos-products">
                            <div class="sd-pos-search">
                                <i class="bi bi-search"></i>
                                <input type="text" class="sd-pos-search-input" id="searchInput" placeholder="Search items..." autofocus>
                            </div>
                            <div class="sd-pos-grid" id="itemGrid">
                                <div th:each="ing : ${ingredients}" class="sd-pos-item"
                                     th:attr="data-id=${ing.id},data-name=${ing.name},data-cost=${ing.currentUnitCost != null ? ing.currentUnitCost : 0},data-type='ingredient'">
                                    <div class="sd-pos-item-icon"><i class="bi bi-box-seam" style="color:var(--mb-blue-500)"></i></div>
                                    <div class="sd-pos-item-name" th:text="${ing.name}">Ingredient</div>
                                    <div class="sd-pos-item-sub" th:text="${ing.unitOfMeasure?.name()}">Unit</div>
                                    <div class="sd-pos-item-price" th:text="'$' + ${#numbers.formatDecimal(ing.currentUnitCost, 1, 2)}">$0</div>
                                    <div class="sd-pos-item-badge">ING</div>
                                </div>
                                <div th:each="prod : ${products}" class="sd-pos-item"
                                     th:attr="data-id=${prod.id},data-name=${prod.name},data-cost=${prod.unitCost != null ? prod.unitCost : 0},data-type='product'">
                                    <div class="sd-pos-item-icon"><i class="bi bi-box2" style="color:var(--mb-amber-500)"></i></div>
                                    <div class="sd-pos-item-name" th:text="${prod.name}">Product</div>
                                    <div class="sd-pos-item-sub">Stock: <span th:text="${#numbers.formatDecimal(prod.currentStock, 1, 2)}">0</span></div>
                                    <div class="sd-pos-item-price" th:text="'$' + ${#numbers.formatDecimal(prod.unitCost, 1, 2)}">$0</div>
                                    <div class="sd-pos-item-badge">PROD</div>
                                </div>
                                <div th:if="${#lists.isEmpty(ingredients) and #lists.isEmpty(products)}" class="sd-pos-empty-state">
                                    <div>No active ingredient or SIN_RECETA products to purchase.</div>
                                </div>
                            </div>
                        </div>

                        <div class="sd-pos-cart">
                            <div class="sd-pos-cart-header">
                                <div class="sd-pos-cart-header-title">
                                    <i class="bi bi-cart3"></i>
                                    <span>Purchase</span>
                                    <span class="sd-pos-cart-count" id="cartCount">0</span>
                                </div>
                                <div style="display:flex;align-items:center;gap:0.2rem">
                                    <button type="button" class="sd-pos-cart-close" id="cartClose" title="Close cart">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                    <button type="button" class="sd-pos-cart-clear" id="clearBtn" title="Clear cart">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="sd-pos-cart-items" id="cartItems">
                                <div class="sd-pos-cart-empty" id="cartEmpty">
                                    <i class="bi bi-bag"></i>
                                    <p>Tap an item to add it</p>
                                </div>
                            </div>

                            <div class="sd-pos-cart-footer" id="cartFooter" style="display:none">
                                <div class="sd-pos-total">
                                    <span class="sd-pos-total-label">TOTAL</span>
                                    <span class="sd-pos-total-val" id="cartTotalVal">$0</span>
                                </div>

                                <button type="button" class="sd-pos-btn-pagar" id="registerBtn" disabled>
                                    <i class="bi bi-check-lg"></i><span id="registerLabel">REGISTER PURCHASE</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <form id="purchaseForm" th:action="@{/purchase}" method="post" style="display:none">
                    <div id="formFields"></div>
                    <input type="hidden" name="supplierId" id="formSupplierId" value="">
                    <input type="hidden" name="purchaseDate" id="formPurchaseDate" value="">
                    <input type="hidden" name="observations" id="formObservations" value="">
                </form>

                <div class="sd-pos-cart-backdrop" id="cartBackdrop"></div>
                <button type="button" class="sd-pos-cart-fab" id="cartFab" aria-label="Open cart">
                    <i class="bi bi-cart3"></i>
                    <span class="sd-pos-cart-fab-count" id="cartFabCount">0</span>
                    <span class="sd-pos-cart-fab-total" id="cartFabTotal">$0</span>
                </button>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        var cart = [];

        function fmt(val) {
            return '$' + Number(val).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function parseNum(v) {
            v = parseFloat(v);
            return isNaN(v) ? 0 : v;
        }

        function getTotal() {
            return cart.reduce(function(s, i) { return s + i.quantity * i.cost; }, 0);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function(c) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
            });
        }

        function addToCart(type, id, name, cost) {
            var existing = cart.find(function(i) { return i.type === type && i.id === id; });
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({type: type, id: id, name: name, cost: cost > 0 ? cost : 0, quantity: 1});
            }
            render();
        }

        function changeQty(idx, delta) {
            cart[idx].quantity += delta;
            if (cart[idx].quantity <= 0) {
                cart.splice(idx, 1);
            }
            render();
        }

        function setCost(idx, value) {
            cart[idx].cost = parseNum(value);
            render();
        }

        function removeItem(idx) {
            cart.splice(idx, 1);
            render();
        }

        function clearCart() {
            if (cart.length === 0) return;
            if (!confirm('Clear cart?')) return;
            cart = [];
            render();
        }

        function render() {
            var items = document.getElementById('cartItems');
            var empty = document.getElementById('cartEmpty');
            var footer = document.getElementById('cartFooter');
            var count = document.getElementById('cartCount');
            var totalVal = document.getElementById('cartTotalVal');
            var registerBtn = document.getElementById('registerBtn');
            var registerLabel = document.getElementById('registerLabel');

            count.textContent = cart.length;
            var fabCount = document.getElementById('cartFabCount');
            var fabTotal = document.getElementById('cartFabTotal');
            if (fabCount) fabCount.textContent = cart.length;
            if (fabTotal) fabTotal.textContent = fmt(getTotal());

            items.querySelectorAll('.sd-pos-cart-row').forEach(function(el) { el.remove(); });

            if (cart.length === 0) {
                empty.style.display = '';
                footer.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            footer.style.display = '';

            cart.forEach(function(item, idx) {
                var row = document.createElement('div');
                row.className = 'sd-pos-cart-row';
                row.innerHTML =
                    '<div class="sd-pos-cart-row-name">' + escapeHtml(item.name) + '</div>' +
                    '<div class="sd-pos-cart-row-controls">' +
                        '<div class="sd-pos-cart-row-cost">' +
                            '<span class="sd-pos-cart-row-cost-prefix">$</span>' +
                            '<input type="number" min="0" step="0.01" class="sd-pos-cart-row-cost-input" value="' + item.cost.toFixed(2) + '" data-idx="' + idx + '" aria-label="Unit cost">' +
                        '</div>' +
                        '<div class="sd-pos-qty-group">' +
                            '<button type="button" class="sd-pos-qty-btn" data-act="minus" data-idx="' + idx + '">&minus;</button>' +
                            '<span class="sd-pos-qty-val">' + item.quantity + '</span>' +
                            '<button type="button" class="sd-pos-qty-btn" data-act="plus" data-idx="' + idx + '">+</button>' +
                        '</div>' +
                        '<span class="sd-pos-cart-row-sub">' + fmt(item.quantity * item.cost) + '</span>' +
                        '<button type="button" class="sd-pos-cart-row-del" data-act="del" data-idx="' + idx + '" title="Remove">&times;</button>' +
                    '</div>';
                items.appendChild(row);
            });

            items.querySelectorAll('.sd-pos-cart-row-cost-input').forEach(function(input) {
                input.addEventListener('input', function() {
                    var i = parseInt(this.dataset.idx);
                    if (!isNaN(i) && cart[i]) {
                        cart[i].cost = parseNum(this.value);
                        updateTotals();
                    }
                });
            });

            var total = getTotal();
            totalVal.textContent = fmt(total);
            registerLabel.textContent = 'REGISTER PURCHASE ' + fmt(total);
            registerBtn.disabled = cart.length === 0;
        }

        function updateTotals() {
            var totalVal = document.getElementById('cartTotalVal');
            var registerLabel = document.getElementById('registerLabel');
            var fabTotal = document.getElementById('cartFabTotal');
            var total = getTotal();
            totalVal.textContent = fmt(total);
            registerLabel.textContent = 'REGISTER PURCHASE ' + fmt(total);
            if (fabTotal) fabTotal.textContent = fmt(total);
        }

        document.getElementById('itemGrid').addEventListener('click', function(e) {
            var item = e.target.closest('.sd-pos-item');
            if (!item) return;
            addToCart(item.dataset.type, parseInt(item.dataset.id), item.dataset.name, parseFloat(item.dataset.cost));
            item.style.transform = 'scale(0.94)';
            setTimeout(function() { item.style.transform = ''; }, 120);
        });

        document.getElementById('cartItems').addEventListener('click', function(e) {
            var btn = e.target.closest('[data-act]');
            if (!btn) return;
            var idx = parseInt(btn.dataset.idx);
            if (btn.dataset.act === 'plus') changeQty(idx, 1);
            else if (btn.dataset.act === 'minus') changeQty(idx, -1);
            else if (btn.dataset.act === 'del') removeItem(idx);
        });

        document.getElementById('clearBtn').addEventListener('click', clearCart);

        document.getElementById('searchInput').addEventListener('input', function() {
            var q = this.value.toLowerCase();
            document.querySelectorAll('.sd-pos-item').forEach(function(el) {
                el.style.display = (el.dataset.name || '').toLowerCase().includes(q) ? '' : 'none';
            });
        });

        document.getElementById('registerBtn').addEventListener('click', function() {
            if (cart.length === 0) return;

            var supplierId = document.getElementById('supplierSelect').value;
            var purchaseDate = document.getElementById('purchaseDate').value;
            var observations = document.getElementById('observations').value;

            if (!supplierId) {
                alert('Select a supplier');
                return;
            }
            if (!purchaseDate) {
                alert('Select the purchase date');
                return;
            }

            var invalidCost = cart.some(function(i) { return i.cost <= 0; });
            if (invalidCost) {
                alert('Every item must have a unit cost greater than zero');
                return;
            }

            var fields = document.getElementById('formFields');
            fields.innerHTML = '';
            cart.forEach(function(item, idx) {
                function add(name, value) {
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'items[' + idx + '].' + name;
                    input.value = value;
                    fields.appendChild(input);
                }
                if (item.type === 'ingredient') {
                    add('ingredientId', item.id);
                } else {
                    add('productId', item.id);
                }
                add('quantity', item.quantity.toFixed(4));
                add('unitCost', item.cost.toFixed(4));
            });

            document.getElementById('formSupplierId').value = supplierId;
            document.getElementById('formPurchaseDate').value = purchaseDate;
            document.getElementById('formObservations').value = observations;
            document.getElementById('purchaseForm').submit();
        });

        // Mobile cart drawer
        var cartEl = document.querySelector('.sd-pos-cart');
        var cartFab = document.getElementById('cartFab');
        var cartBackdrop = document.getElementById('cartBackdrop');
        var cartClose = document.getElementById('cartClose');

        if (cartFab) cartFab.addEventListener('click', function() {
            cartEl.classList.add('open');
            cartBackdrop.classList.add('open');
        });
        if (cartBackdrop) cartBackdrop.addEventListener('click', function() {
            cartEl.classList.remove('open');
            cartBackdrop.classList.remove('open');
        });
        if (cartClose) cartClose.addEventListener('click', function() {
            cartEl.classList.remove('open');
            cartBackdrop.classList.remove('open');
        });
    </script>
</body>
</html>
