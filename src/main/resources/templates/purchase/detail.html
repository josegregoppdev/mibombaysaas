<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase #1 — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="sd-page-header sd-fade sd-fade--1">
                    <div>
                        <h1 class="sd-page-title">Purchase #<span th:text="${purchase.id}">1</span></h1>
                        <p class="sd-page-desc">Registered purchase detail</p>
                        <div class="sd-title-accent"></div>
                    </div>
                    <div class="sd-page-actions">
                        <a th:href="@{/purchase}" class="sd-btn sd-btn--outline">
                            <i class="bi bi-arrow-left"></i>Back
                        </a>
                    </div>
                </div>

                <div class="sd-info-grid sd-fade sd-fade--2">
                    <div class="sd-info-card">
                        <div class="sd-info-label">Supplier</div>
                        <div class="sd-info-value" th:text="${purchase.supplierName}">Supplier</div>
                    </div>
                    <div class="sd-info-card">
                        <div class="sd-info-label">Date</div>
                        <div class="sd-info-value" th:text="${#temporals.format(purchase.purchaseDate, 'dd/MM/yyyy HH:mm')}">01/01/2025</div>
                    </div>
                    <div class="sd-info-card">
                        <div class="sd-info-label">Registered by</div>
                        <div class="sd-info-value" th:text="${purchase.userName ?: '\u2014'}">User</div>
                    </div>
                    <div class="sd-info-card">
                        <div class="sd-info-label">Status</div>
                        <div class="sd-info-value">
                            <span class="sa-badge" th:classappend="${purchase.active} ? 'sa-badge--success' : 'sa-badge--danger'"
                                  th:text="${purchase.active} ? 'Active' : 'Cancelled'">Active</span>
                        </div>
                    </div>
                    <div class="sd-info-card">
                        <div class="sd-info-label">Total</div>
                        <div class="sd-info-value sd-info-value--accent" th:text="'$' + ${#numbers.formatDecimal(purchase.total, 1, 2)}">$0.00</div>
                    </div>
                    <div class="sd-info-card" th:if="${purchase.observations}">
                        <div class="sd-info-label">Notes</div>
                        <div class="sd-info-value" style="font-size:0.88rem" th:text="${purchase.observations}">Note</div>
                    </div>
                </div>

                <div class="sd-list-card sd-fade sd-fade--3">
                    <div class="sd-list-card-glow"></div>
                    <div class="sd-list-card-header">
                        <div class="sd-list-card-title">
                            <i class="bi bi-list-ul"></i>
                            <span>Items</span>
                        </div>
                    </div>

                    <div class="sa-table-wrapper">
                        <table class="sa-table">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Type</th>
                                    <th class="sa-cell-right">Quantity</th>
                                    <th class="sa-cell-right">Unit Cost</th>
                                    <th class="sa-cell-right">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="det : ${purchase.details}" class="sd-table-row">
                                    <td th:text="${det.itemName}">Item</td>
                                    <td>
                                        <span class="sa-badge sa-badge--profit-high" th:if="${det.productId != null}" style="font-size:0.7rem">PRODUCT</span>
                                        <span class="sa-badge sa-badge--info" th:unless="${det.productId != null}" style="font-size:0.7rem">INGREDIENT</span>
                                    </td>
                                    <td class="sa-cell-right" th:text="${#numbers.formatDecimal(det.quantity, 1, 2)}">0.00</td>
                                    <td class="sa-cell-right" th:text="'$' + ${#numbers.formatDecimal(det.unitCost, 1, 2)}">$0.00</td>
                                    <td class="sa-cell-right" th:text="'$' + ${#numbers.formatDecimal(det.totalCost, 1, 2)}">$0.00</td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr class="sd-table-row">
                                    <td colspan="4" class="sa-cell-right"><strong>TOTAL:</strong></td>
                                    <td class="sa-cell-right"><strong th:text="'$' + ${#numbers.formatDecimal(purchase.total, 1, 2)}">$0.00</strong></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>

                <div class="sd-form-actions sd-fade sd-fade--4">
                    <form th:if="${purchase.active}" th:action="@{/purchase/{id}/cancel(id=${purchase.id})}" method="post"
                          onsubmit="return confirm('Cancel this purchase? Stock and costs will be reverted.');">
                        <button type="submit" class="sd-btn sd-btn--danger">
                            <i class="bi bi-x-octagon"></i>Cancel Purchase
                        </button>
                    </form>
                    <a th:href="@{/purchase}" class="sd-btn sd-btn--outline">
                        <i class="bi bi-arrow-left"></i>Back to Purchases
                    </a>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.sd-fade').forEach(function(el, i) {
                setTimeout(function() {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 80 * i);
            });
        });
    </script>
</body>
</html>
