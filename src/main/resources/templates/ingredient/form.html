<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${ingredient.id} ? 'Edit ingredient' : 'New ingredient'">Ingredient — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="mb-dashboard-header">
                    <h1 class="display-6" th:text="${ingredient.id} ? 'Edit ingredient' : 'New ingredient'">Title</h1>
                    <p class="text-muted">Complete the form fields</p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="${ingredient.id} ? @{/ingredient/{id}(id=${ingredient.id})} : @{/ingredient}"
                              th:object="${ingredient}" method="post">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label" for="code">Code</label>
                                    <input type="text" class="form-control" id="code" th:field="*{code}"
                                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                                           placeholder="E.g.: CAR-001">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('code')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label" for="name">Name</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                           placeholder="E.g.: Ground beef">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('name')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="description">Description</label>
                                    <textarea class="form-control" id="description" rows="2" th:field="*{description}"
                                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                              placeholder="Optional description"></textarea>
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('description')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="category">Category</label>
                                    <select class="form-select" id="category" th:field="*{category}">
                                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}">Category</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="unitOfMeasure">Unit of measure</label>
                                    <select class="form-select" id="unitOfMeasure" th:field="*{unitOfMeasure}"
                                            th:classappend="${#fields.hasErrors('unitOfMeasure')} ? 'is-invalid'">
                                        <option th:each="um : ${T(com.josegregoppdev.mibombay.model.ingredient.UnitOfMeasure).values()}"
                                                th:value="${um}" th:text="${um}">UNIT</option>
                                    </select>
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('unitOfMeasure')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="currentUnitCost">Unit cost</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999" class="form-control" id="currentUnitCost"
                                           th:field="*{currentUnitCost}" th:classappend="${#fields.hasErrors('currentUnitCost')} ? 'is-invalid'"
                                           placeholder="0.00">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('currentUnitCost')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="currentStock">Current stock</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999" class="form-control" id="currentStock"
                                           th:field="*{currentStock}" th:classappend="${#fields.hasErrors('currentStock')} ? 'is-invalid'"
                                           placeholder="0">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('currentStock')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="minimumStock">Minimum stock</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999" class="form-control" id="minimumStock"
                                           th:field="*{minimumStock}" th:classappend="${#fields.hasErrors('minimumStock')} ? 'is-invalid'"
                                           placeholder="0">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('minimumStock')}" th:text="${err}">Error</div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i>
                                    <span th:text="${ingredient.id} ? 'Update' : 'Create'">Save</span>
                                </button>
                                <a th:href="@{/ingredient}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-lg"></i>Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
