<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredients — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                    <div>
                        <h1 class="display-6">Ingredients</h1>
                        <p class="text-muted mb-0">Manage inventory ingredients</p>
                    </div>
                    <a th:href="@{/ingredient/new}" class="btn btn-primary">
                        <i class="bi bi-plus-lg"></i>New ingredient
                    </a>
                </div>

                <!-- Filter Card -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <form th:action="@{/ingredient}" method="get" class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label" for="filterName">Name</label>
                                <input type="text" class="form-control" id="filterName" name="name"
                                       th:value="${name}" placeholder="Search by name...">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="filterCategory">Category</label>
                                <select class="form-select" id="filterCategory" name="category">
                                    <option value="">All</option>
                                    <option th:each="cat : ${categories}" th:value="${cat}"
                                            th:text="${cat.displayName}"
                                            th:selected="${cat == selectedCategory}">Category</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="filterUnit">Unit</label>
                                <select class="form-select" id="filterUnit" name="unitOfMeasure">
                                    <option value="">All</option>
                                    <option th:each="um : ${unitsOfMeasure}" th:value="${um}"
                                            th:text="${um}" th:selected="${um == selectedUnitOfMeasure}">Unit</option>
                                </select>
                            </div>
                            <div class="col-md-2 d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-fill">
                                    <i class="bi bi-search"></i>Filter
                                </button>
                                <a th:href="@{/ingredient}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-lg"></i>
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Code</th>
                                        <th>Name</th>
                                        <th>Category</th>
                                        <th>Unit</th>
                                        <th>Cost</th>
                                        <th>Stock</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="ing : ${page.content}">
                                        <td><code th:text="${ing.code}">CODE</code></td>
                                        <td th:text="${ing.name}" class="fw-medium">Name</td>
                                        <td th:text="${ing.category?.displayName ?: '\u2014'}">Category</td>
                                        <td th:text="${ing.unitOfMeasure}">UNIT</td>
                                        <td th:text="${ing.currentUnitCost}">0.00</td>
                                        <td th:text="${ing.currentStock}">0</td>
                                        <td>
                                            <span th:if="${ing.active}" class="badge bg-success">Active</span>
                                            <span th:unless="${ing.active}" class="badge bg-danger">Inactive</span>
                                        </td>
                                        <td class="text-end">
                                            <a th:href="@{/ingredient/{id}/edit(id=${ing.id})}" class="btn btn-sm btn-outline-primary me-1">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/ingredient/{id}/toggle-status(id=${ing.id})}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm"
                                                        th:classappend="${ing.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                        onclick="return confirm('Change status of this ingredient?')">
                                                    <i th:if="${ing.active}" class="bi bi-x-circle"></i>
                                                    <i th:unless="${ing.active}" class="bi bi-check-circle"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.totalElements == 0}">
                                        <td colspan="8" class="mb-empty">
                                            <i class="bi bi-inbox"></i>
                                            <p class="fw-medium mt-2">No ingredients registered</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav th:if="${page.totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/ingredient(page=0, name=${name}, category=${selectedCategory}, unitOfMeasure=${selectedUnitOfMeasure})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                            th:classappend="${i == page.number} ? 'active'">
                            <a class="page-link" th:href="@{/ingredient(page=${i}, name=${name}, category=${selectedCategory}, unitOfMeasure=${selectedUnitOfMeasure})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/ingredient(page=${page.totalPages - 1}, name=${name}, category=${selectedCategory}, unitOfMeasure=${selectedUnitOfMeasure})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
