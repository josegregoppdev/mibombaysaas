<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-auth">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="mb-main d-flex align-items-center py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5 col-xl-4">
                    <div class="card mb-auth-card border-0">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <h1 class="mb-brand fs-2">
                                    <span class="mb-brand-mi">Mi</span><span class="mb-brand-bombay">Bombay</span>
                                </h1>
                                <p class="text-muted mb-0">Log in to your account</p>
                            </div>

                            <div th:if="${param.expired}" class="alert alert-warning" role="alert">
                                <i class="bi bi-clock me-2"></i>Your session expired. Please log in again.
                            </div>
                            <div th:if="${error}" class="alert alert-danger" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <span th:text="${error}">Error</span>
                            </div>
                            <div th:if="${message}" class="alert alert-success" role="alert">
                                <i class="bi bi-check-circle-fill me-2"></i>
                                <span th:text="${message}">Message</span>
                            </div>

                            <form th:action="@{/login}" method="post">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="subdomain" name="subdomain"
                                           placeholder="e.g.: 1, myrestaurant" required autofocus>
                                    <label for="subdomain">Restaurant subdomain</label>
                                    <div class="form-text">
                                        <i class="bi bi-info-circle me-1"></i>
                                        E.g.: <code>1</code> for the demo restaurant
                                    </div>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="username" name="username"
                                           placeholder="name@example.com" required>
                                    <label for="username">Email</label>
                                </div>

                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control" id="password" name="password"
                                           placeholder="Password" required>
                                    <label for="password">Password</label>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 btn-lg">
                                    <i class="bi bi-box-arrow-in-right"></i>Log in
                                </button>
                            </form>

                            <div class="text-center mt-4">
                                <p class="mb-0 text-muted small">
                                    Don't have an account?
                                    <a th:href="@{/registration}" class="fw-medium">Register here</a>
                                </p>
                                <p class="mt-2 mb-0">
                                    <a th:href="@{/admin/login}" class="text-muted small">
                                        <i class="bi bi-shield-lock me-1"></i>Admin access
                                    </a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
