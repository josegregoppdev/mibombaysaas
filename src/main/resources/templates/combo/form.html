<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${combo.id} ? 'Edit combo' : 'New combo'">Combo — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="mb-dashboard-header">
                    <h1 class="display-6" th:text="${combo.id} ? 'Edit combo' : 'New combo'">Title</h1>
                    <p class="text-muted">Complete the form fields</p>
                </div>

                <form th:action="${combo.id} ? @{/combo/{id}(id=${combo.id})} : @{/combo}"
                      th:object="${combo}" method="post">

                    <!-- Combo Info -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="card-title"><i class="bi bi-info-circle me-2"></i>Combo information</h5>
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="form-label" for="code">Code</label>
                                    <input type="text" class="form-control" id="code" th:field="*{code}"
                                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                                           placeholder="E.g.: COM-001">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('code')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-9">
                                    <label class="form-label" for="name">Name</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                           placeholder="E.g.: Hamburger + Fries Combo">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('name')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="description">Description</label>
                                    <textarea class="form-control" id="description" rows="2" th:field="*{description}"
                                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                              placeholder="Optional description"></textarea>
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('description')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="sellingPrice">Selling price</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999"
                                           class="form-control" id="sellingPrice" th:field="*{sellingPrice}"
                                           th:classappend="${#fields.hasErrors('sellingPrice')} ? 'is-invalid'" placeholder="0.00">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('sellingPrice')}" th:text="${err}">Error</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Products -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="card-title mb-0"><i class="bi bi-bag me-2"></i>Products</h5>
                                <button type="button" class="btn btn-sm btn-outline-primary" id="addDetailBtn">
                                    <i class="bi bi-plus-lg"></i>Add product
                                </button>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-hover align-middle" id="detailsTable">
                                    <thead class="table-light">
                                        <tr>
                                            <th style="width:30%">Product</th>
                                            <th style="width:15%">Quantity</th>
                                            <th style="width:15%">Unit cost</th>
                                            <th style="width:15%">Total cost</th>
                                            <th style="width:20%">Notes</th>
                                            <th style="width:5%"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="detail, stat : *{details}" class="detail-row">
                                            <td>
                                                <select class="form-select form-select-sm product-select"
                                                        th:field="*{details[__${stat.index}__].productId}"
                                                        th:classappend="${#fields.hasErrors('details[__${stat.index}__].productId')} ? 'is-invalid'">
                                                    <option value="">Select...</option>
                                                    <option th:each="prod : ${products}" th:value="${prod.id}"
                                                            th:text="${prod.name}" th:data-cost="${prod.unitCost}">Product</option>
                                                </select>
                                                <div class="invalid-feedback" th:each="err : ${#fields.errors('details[__${stat.index}__].productId')}" th:text="${err}">Error</div>
                                            </td>
                                            <td>
                                                <input type="number" step="0.0001" min="0.0001" max="99999999.9999"
                                                       class="form-control form-control-sm quantity-input"
                                                       th:field="*{details[__${stat.index}__].quantity}"
                                                       th:classappend="${#fields.hasErrors('details[__${stat.index}__].quantity')} ? 'is-invalid'">
                                                <div class="invalid-feedback" th:each="err : ${#fields.errors('details[__${stat.index}__].quantity')}" th:text="${err}">Error</div>
                                            </td>
                                            <td>
                                                <input type="number" step="0.0001" min="0" max="99999999.9999"
                                                       class="form-control form-control-sm unit-cost-input" readonly>
                                                <input type="hidden" class="unit-cost-hidden" th:field="*{details[__${stat.index}__].unitCost}">
                                            </td>
                                            <td>
                                                <input type="number" step="0.0001" min="0" max="99999999.9999"
                                                       class="form-control form-control-sm total-cost-input" readonly>
                                                <input type="hidden" class="total-cost-hidden" th:field="*{details[__${stat.index}__].totalCost}">
                                            </td>
                                            <td>
                                                <input type="text" class="form-control form-control-sm"
                                                       th:field="*{details[__${stat.index}__].notes}" placeholder="Optional">
                                            </td>
                                            <td>
                                                <input type="hidden" th:field="*{details[__${stat.index}__].id}">
                                                <button type="button" class="btn btn-sm btn-outline-danger remove-detail-btn">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="d-flex justify-content-end mt-3">
                                <span class="text-muted me-3">Total cost:</span>
                                <strong class="fs-5" id="totalComboCost">0.00</strong>
                            </div>
                        </div>
                    </div>

                    <!-- Margin -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <label class="form-label">Margin</label>
                            <div class="form-control-plaintext fw-bold fs-5" id="marginDisplay">0.0000</div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i>
                            <span th:text="${combo.id} ? 'Update' : 'Create'">Save</span>
                        </button>
                        <a th:href="@{/combo}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg"></i>Cancel
                        </a>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var products = /*[[${products.content}]]*/ [];
            var table = document.getElementById('detailsTable');
            var tbody = table.querySelector('tbody');
            var addBtn = document.getElementById('addDetailBtn');
            var rowIndex = tbody.querySelectorAll('.detail-row').length;
            var spInput = document.getElementById('sellingPrice');

            function buildOpts() {
                var h = '<option value="">Select...</option>';
                products.forEach(function(p) { h += '<option value="' + p.id + '" data-cost="' + p.unitCost + '">' + p.name + '</option>'; });
                return h;
            }

            function updateMargin(total) {
                total = total || 0;
                tbody.querySelectorAll('.detail-row').forEach(function(r) {
                    var h = r.querySelector('.total-cost-hidden');
                    if (h && h.value) total += parseFloat(h.value) || 0;
                });
                var price = parseFloat(spInput.value) || 0;
                var m = price - total;
                var md = document.getElementById('marginDisplay');
                md.textContent = m.toFixed(4);
                md.className = 'form-control-plaintext fw-bold fs-5 ' + (m >= 0 ? 'text-success' : 'text-danger');
            }

            function updateCalc(row) {
                var sel = row.querySelector('.product-select');
                var qty = row.querySelector('.quantity-input');
                var uci = row.querySelector('.unit-cost-input');
                var uch = row.querySelector('.unit-cost-hidden');
                var tci = row.querySelector('.total-cost-input');
                var tch = row.querySelector('.total-cost-hidden');
                if (sel.value) {
                    var cost = parseFloat(sel.options[sel.selectedIndex].getAttribute('data-cost')) || 0;
                    uci.value = cost.toFixed(4);
                    uch.value = cost;
                    var q = parseFloat(qty.value) || 0;
                    var t = q * cost;
                    tci.value = t.toFixed(4);
                    tch.value = t;
                } else {
                    uci.value = uch.value = tci.value = tch.value = '';
                }
                updateMargin(0);
            }

            function bindRow(row) {
                row.querySelector('.product-select').addEventListener('change', function() { updateCalc(row); });
                row.querySelector('.quantity-input').addEventListener('input', function() { updateCalc(row); });
                row.querySelector('.remove-detail-btn').addEventListener('click', function() { row.remove(); updateMargin(0); });
            }

            tbody.querySelectorAll('.detail-row').forEach(function(r) {
                bindRow(r);
                if (r.querySelector('.quantity-input').value && r.querySelector('.product-select').value) updateCalc(r);
            });

            spInput.addEventListener('input', function() { updateMargin(0); });

            addBtn.addEventListener('click', function() {
                var r = document.createElement('tr');
                r.className = 'detail-row';
                r.innerHTML = '<td><select class="form-select form-select-sm product-select" name="details[' + rowIndex + '].productId">' + buildOpts() + '</select></td>'
                    + '<td><input type="number" step="0.0001" min="0.0001" max="99999999.9999" class="form-control form-control-sm quantity-input" name="details[' + rowIndex + '].quantity"></td>'
                    + '<td><input type="number" step="0.0001" min="0" max="99999999.9999" class="form-control form-control-sm unit-cost-input" readonly><input type="hidden" class="unit-cost-hidden" name="details[' + rowIndex + '].unitCost"></td>'
                    + '<td><input type="number" step="0.0001" min="0" max="99999999.9999" class="form-control form-control-sm total-cost-input" readonly><input type="hidden" class="total-cost-hidden" name="details[' + rowIndex + '].totalCost"></td>'
                    + '<td><input type="text" class="form-control form-control-sm" name="details[' + rowIndex + '].notes" placeholder="Optional"></td>'
                    + '<td><input type="hidden" name="details[' + rowIndex + '].id"><button type="button" class="btn btn-sm btn-outline-danger remove-detail-btn"><i class="bi bi-trash"></i></button></td>';
                tbody.appendChild(r);
                bindRow(r);
                rowIndex++;
            });

            updateMargin(0);
        });
    </script>
</body>
</html>
