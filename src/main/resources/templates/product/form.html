<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id} ? 'Edit product' : 'New product'">Product - MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="mb-dashboard-header">
                    <h1 class="display-6" th:text="${product.id} ? 'Edit product' : 'New product'">Title</h1>
                    <p class="lead text-muted">Complete the form fields</p>
                </div>

                <form th:action="${product.id} ? @{/product/{id}(id=${product.id})} : @{/product}"
                      th:object="${product}" method="post" class="needs-validation">

                    <!-- Product Information -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="card-title mb-3">
                                <i class="bi bi-info-circle text-primary me-2"></i>Product information
                            </h5>
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label for="code" class="form-label">Code</label>
                                    <input type="text" class="form-control" id="code"
                                           th:field="*{code}"
                                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                                           placeholder="E.g.: HAM-001">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('code')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-md-9">
                                    <label for="name" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="name"
                                           th:field="*{name}"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                           placeholder="E.g.: Classic Hamburger">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('name')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-12">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" rows="2"
                                              th:field="*{description}"
                                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                              placeholder="Optional description"></textarea>
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('description')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-md-4">
                                    <label for="category" class="form-label">Category</label>
                                    <select class="form-select" id="category" th:field="*{category}">
                                        <option value="">Select...</option>
                                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}">Category</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label for="productType" class="form-label">Product type</label>
                                    <select class="form-select" id="productType" th:field="*{productType}"
                                            th:classappend="${#fields.hasErrors('productType')} ? 'is-invalid'">
                                        <option th:each="pt : ${productTypes}" th:value="${pt}" th:text="${pt.displayName}">Type</option>
                                    </select>
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('productType')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-md-4">
                                    <label for="sellingPrice" class="form-label">Selling price</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999"
                                           class="form-control" id="sellingPrice"
                                           th:field="*{sellingPrice}"
                                           th:classappend="${#fields.hasErrors('sellingPrice')} ? 'is-invalid'"
                                           placeholder="0.00">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('sellingPrice')}" th:text="${err}">Error</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pricing & Recipe -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="card-title mb-3">
                                <i class="bi bi-calculator text-primary me-2"></i>Pricing &amp; Recipe
                            </h5>
                            <div class="row g-3">
                                <!-- Recipe dropdown (CON_RECETA and ADICIONAL) -->
                                <div class="col-md-6" id="recipeSection" style="display: none;">
                                    <label for="recipeId" class="form-label">Recipe</label>
                                    <select class="form-select" id="recipeId" th:field="*{recipeId}">
                                        <option value="">None</option>
                                        <option th:each="rec : ${recipes.content}" th:value="${rec.id}" th:text="${rec.name}"
                                                th:data-cost="${rec.productionCost}">Recipe</option>
                                    </select>
                                    <div class="form-text">Select a recipe for this product</div>
                                </div>

                                <!-- Unit cost (SIN_RECETA and ADICIONAL) -->
                                <div class="col-md-4" id="unitCostSection" style="display: none;">
                                    <label for="unitCost" class="form-label">Unit cost</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999"
                                           class="form-control" id="unitCost"
                                           th:field="*{unitCost}"
                                           th:classappend="${#fields.hasErrors('unitCost')} ? 'is-invalid'"
                                           placeholder="0.00">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('unitCost')}" th:text="${err}">Error</div>
                                </div>

                                <!-- Recipe production cost (read-only, shown when recipe is selected) -->
                                <div class="col-md-4" id="recipeCostSection" style="display: none;">
                                    <label class="form-label">Recipe production cost</label>
                                    <input type="text" class="form-control" id="recipeProductionCost" readonly
                                           placeholder="0.0000">
                                </div>

                                <!-- Margin display -->
                                <div class="col-md-4">
                                    <label class="form-label">Margin</label>
                                    <div class="form-control-plaintext fw-bold" id="marginDisplay">0.0000</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-2"></i>
                            <span th:text="${product.id} ? 'Update' : 'Create'">Save</span>
                        </button>
                        <a th:href="@{/product}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg me-2"></i>Cancel
                        </a>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var productTypeSelect = document.getElementById('productType');
            var recipeSection = document.getElementById('recipeSection');
            var unitCostSection = document.getElementById('unitCostSection');
            var recipeCostSection = document.getElementById('recipeCostSection');
            var recipeIdSelect = document.getElementById('recipeId');
            var unitCostInput = document.getElementById('unitCost');
            var sellingPriceInput = document.getElementById('sellingPrice');
            var recipeProductionCostInput = document.getElementById('recipeProductionCost');
            var marginDisplay = document.getElementById('marginDisplay');

            function updateVisibility() {
                var type = productTypeSelect.value;
                recipeSection.style.display = (type === 'CON_RECETA' || type === 'ADICIONAL') ? '' : 'none';
                unitCostSection.style.display = (type === 'SIN_RECETA' || type === 'ADICIONAL') ? '' : 'none';
                if (type === 'CON_RECETA') {
                    recipeIdSelect.required = true;
                } else {
                    recipeIdSelect.required = false;
                }
                updateMargin();
            }

            function updateMargin() {
                var sellingPrice = parseFloat(sellingPriceInput.value) || 0;
                var cost = 0;
                if (recipeIdSelect.value) {
                    var option = recipeIdSelect.options[recipeIdSelect.selectedIndex];
                    cost = parseFloat(option.getAttribute('data-cost')) || 0;
                    recipeProductionCostInput.value = cost.toFixed(4);
                    recipeCostSection.style.display = '';
                } else {
                    recipeProductionCostInput.value = '';
                    recipeCostSection.style.display = 'none';
                    cost = parseFloat(unitCostInput.value) || 0;
                }
                var margin = sellingPrice - cost;
                marginDisplay.textContent = margin.toFixed(4);
                marginDisplay.className = 'form-control-plaintext fw-bold ' + (margin >= 0 ? 'text-success' : 'text-danger');
            }

            productTypeSelect.addEventListener('change', updateVisibility);
            recipeIdSelect.addEventListener('change', updateMargin);
            unitCostInput.addEventListener('input', updateMargin);
            sellingPriceInput.addEventListener('input', updateMargin);

            updateVisibility();

            if (recipeIdSelect.value) {
                updateMargin();
            }
        });
    </script>
</body>
</html>
