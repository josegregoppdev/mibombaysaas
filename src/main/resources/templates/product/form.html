<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id} ? 'Edit product' : 'New product'">Product — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="mb-dashboard-header">
                    <h1 class="display-6" th:text="${product.id} ? 'Edit product' : 'New product'">Title</h1>
                    <p class="text-muted">Complete the form fields</p>
                </div>

                <form th:action="${product.id} ? @{/product/{id}(id=${product.id})} : @{/product}"
                      th:object="${product}" method="post">

                    <!-- Product Info -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="card-title"><i class="bi bi-info-circle me-2"></i>Product information</h5>
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="form-label" for="code">Code</label>
                                    <input type="text" class="form-control" id="code" th:field="*{code}"
                                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                                           placeholder="E.g.: HAM-001">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('code')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-9">
                                    <label class="form-label" for="name">Name</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                           placeholder="E.g.: Classic Hamburger">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('name')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="description">Description</label>
                                    <textarea class="form-control" id="description" rows="2" th:field="*{description}"
                                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                              placeholder="Optional description"></textarea>
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('description')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="category">Category</label>
                                    <select class="form-select" id="category" th:field="*{category}">
                                        <option value="">Select...</option>
                                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}">Category</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="productType">Product type</label>
                                    <select class="form-select" id="productType" th:field="*{productType}"
                                            th:classappend="${#fields.hasErrors('productType')} ? 'is-invalid'">
                                        <option th:each="pt : ${productTypes}" th:value="${pt}" th:text="${pt.displayName}">Type</option>
                                    </select>
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('productType')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="sellingPrice">Selling price</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999"
                                           class="form-control" id="sellingPrice" th:field="*{sellingPrice}"
                                           th:classappend="${#fields.hasErrors('sellingPrice')} ? 'is-invalid'"
                                           placeholder="0.00">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('sellingPrice')}" th:text="${err}">Error</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pricing & Recipe -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="card-title"><i class="bi bi-calculator me-2"></i>Pricing &amp; Recipe</h5>
                            <div class="row g-3">
                                <div class="col-md-6" id="recipeSection" style="display:none">
                                    <label class="form-label" for="recipeId">Recipe</label>
                                    <select class="form-select" id="recipeId" th:field="*{recipeId}">
                                        <option value="">None</option>
                                        <option th:each="rec : ${recipes.content}" th:value="${rec.id}"
                                                th:text="${rec.name}" th:data-cost="${rec.productionCost}">Recipe</option>
                                    </select>
                                    <div class="form-text">Select a recipe for this product</div>
                                </div>
                                <div class="col-md-4" id="unitCostSection" style="display:none">
                                    <label class="form-label" for="unitCost">Unit cost</label>
                                    <input type="number" step="0.0001" min="0" max="99999999.9999"
                                           class="form-control" id="unitCost" th:field="*{unitCost}"
                                           th:classappend="${#fields.hasErrors('unitCost')} ? 'is-invalid'" placeholder="0.00">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('unitCost')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-4" id="recipeCostSection" style="display:none">
                                    <label class="form-label">Recipe production cost</label>
                                    <input type="text" class="form-control" id="recipeProductionCost" readonly placeholder="0.0000">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Margin</label>
                                    <div class="form-control-plaintext fw-bold" id="marginDisplay">0.0000</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i>
                            <span th:text="${product.id} ? 'Update' : 'Create'">Save</span>
                        </button>
                        <a th:href="@{/product}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg"></i>Cancel
                        </a>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var pt = document.getElementById('productType');
            var rs = document.getElementById('recipeSection');
            var ucs = document.getElementById('unitCostSection');
            var rcs = document.getElementById('recipeCostSection');
            var recipe = document.getElementById('recipeId');
            var uc = document.getElementById('unitCost');
            var sp = document.getElementById('sellingPrice');
            var rpc = document.getElementById('recipeProductionCost');
            var md = document.getElementById('marginDisplay');

            function updateVis() {
                var t = pt.value;
                rs.style.display = (t === 'CON_RECETA' || t === 'ADICIONAL') ? '' : 'none';
                ucs.style.display = (t === 'SIN_RECETA' || t === 'ADICIONAL') ? '' : 'none';
                recipe.required = t === 'CON_RECETA';
                updateMargin();
            }

            function updateMargin() {
                var price = parseFloat(sp.value) || 0;
                var cost = 0;
                if (recipe.value) {
                    cost = parseFloat(recipe.options[recipe.selectedIndex].getAttribute('data-cost')) || 0;
                    rpc.value = cost.toFixed(4);
                    rcs.style.display = '';
                } else {
                    rpc.value = '';
                    rcs.style.display = 'none';
                    cost = parseFloat(uc.value) || 0;
                }
                var m = price - cost;
                md.textContent = m.toFixed(4);
                md.className = 'form-control-plaintext fw-bold ' + (m >= 0 ? 'text-success' : 'text-danger');
            }

            pt.addEventListener('change', updateVis);
            recipe.addEventListener('change', updateMargin);
            uc.addEventListener('input', updateMargin);
            sp.addEventListener('input', updateMargin);
            updateVis();
            if (recipe.value) updateMargin();
        });
    </script>
</body>
</html>
