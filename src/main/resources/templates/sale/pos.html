<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>POS — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .sd-pos-page {
            display: flex; flex-direction: column;
            height: calc(100vh - var(--mb-nav-height) - 4rem);
            min-height: 500px;
        }
        .sd-pos-layout { display: flex; flex: 1; overflow: hidden; border-radius: var(--mb-radius-lg); border: 1px solid var(--mb-border-light); }

        /* Products panel */
        .sd-pos-products { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--mb-bg); min-width: 0; }
        .sd-pos-search { padding: 0.6rem 0.75rem; display: flex; align-items: center; border-bottom: 1px solid var(--mb-border-light); background: #fff; position: relative; flex-shrink: 0; }
        .sd-pos-search i { position: absolute; left: 1.3rem; color: var(--mb-text-light); font-size: 0.85rem; }
        .sd-pos-search-input { width: 100%; padding: 0.45rem 0.75rem 0.45rem 2.3rem; border: 1.5px solid var(--mb-border-light); border-radius: var(--mb-radius-sm); font-size: 0.85rem; background: var(--mb-blue-50); min-height: 38px; }
        .sd-pos-search-input:focus { outline: none; border-color: var(--mb-blue-400); box-shadow: 0 0 0 0.15rem rgba(30,90,150,0.1); background: #fff; }

        .sd-pos-grid { flex: 1; overflow-y: auto; padding: 0.6rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; align-content: start; }
        .sd-pos-item { background: #fff; border: 1.5px solid var(--mb-border-light); border-radius: 10px; padding: 0.6rem 0.4rem; text-align: center; cursor: pointer; transition: all 0.12s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80px; position: relative; user-select: none; }
        .sd-pos-item:hover { border-color: var(--mb-blue-300); box-shadow: var(--mb-shadow); transform: translateY(-1px); }
        .sd-pos-item:active { transform: scale(0.96); }
        .sd-pos-item-icon { font-size: 1.5rem; margin-bottom: 0.15rem; line-height: 1; }
        .sd-pos-item-name { font-size: 0.78rem; font-weight: 600; color: var(--mb-text); margin-bottom: 0.05rem; line-height: 1.1; }
        .sd-pos-item-price { font-size: 0.85rem; font-weight: 700; color: var(--mb-blue-700); }
        .sd-pos-item-badge { position: absolute; top: 5px; right: 5px; font-size: 0.55rem; background: var(--mb-amber-500); color: #fff; padding: 0.08rem 0.4rem; border-radius: 8px; font-weight: 700; letter-spacing: 0.03em; }
        .sd-pos-item.combo { border-left: 3px solid var(--mb-amber-500); }
        .sd-pos-item-plus { position: absolute; top: 5px; left: 5px; width: 24px; height: 24px; border-radius: 50%; background: var(--mb-amber-500); color: #fff; border: none; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; transition: all 0.12s; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
        .sd-pos-item-plus:hover { background: #e0913a; transform: scale(1.15); }
        .sd-pos-item-plus:active { transform: scale(0.9); }

        /* Cart panel */
        .sd-pos-cart { width: 440px; background: var(--mb-blue-900); color: #E8ECF1; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
        .sd-pos-cart-header { padding: 0.6rem 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .sd-pos-cart-header-title { display: flex; align-items: center; gap: 0.4rem; font-weight: 600; font-size: 0.88rem; color: #fff; }
        .sd-pos-cart-count { background: var(--mb-amber-500); color: #1A1A1A; border-radius: 12px; padding: 0.08rem 0.5rem; font-size: 0.7rem; font-weight: 700; min-width: 22px; text-align: center; }
        .sd-pos-cart-clear { background: none; border: none; color: rgba(255,255,255,0.35); font-size: 1rem; cursor: pointer; padding: 0.25rem; border-radius: 6px; }
        .sd-pos-cart-clear:hover { color: var(--mb-error); background: rgba(230,57,70,0.12); }
        .sd-pos-cart-header-actions { display: flex; align-items: center; gap: 0.2rem; }
        .sd-pos-cart-close { display: none; background: none; border: none; color: rgba(255,255,255,0.35); font-size: 1.1rem; cursor: pointer; padding: 0.25rem; border-radius: 6px; }
        .sd-pos-cart-close:hover { color: #fff; background: rgba(255,255,255,0.08); }

        .sd-pos-cart-items { flex: 1; overflow-y: auto; padding: 0.4rem 0.5rem; min-height: 100px; }
        .sd-pos-cart-empty { text-align: center; padding: 2.5rem 1rem; color: rgba(255,255,255,0.25); }
        .sd-pos-cart-empty i { font-size: 2.2rem; display: block; margin-bottom: 0.5rem; opacity: 0.4; }
        .sd-pos-cart-empty p { font-size: 0.8rem; margin: 0; }

        .sd-pos-cart-row { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 0.5rem; margin-bottom: 0.3rem; }
        .sd-pos-cart-row-name { font-size: 0.82rem; font-weight: 500; color: #fff; margin-bottom: 0.05rem; }
        .sd-pos-cart-row-price { font-size: 0.7rem; color: rgba(255,255,255,0.4); }
        .sd-pos-cart-row-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 0.4rem; }
        .sd-pos-qty-group { display: flex; align-items: center; gap: 0.25rem; }
        .sd-pos-qty-btn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: all 0.15s; }
        .sd-pos-qty-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .sd-pos-qty-val { font-size: 0.8rem; font-weight: 600; color: #fff; min-width: 26px; text-align: center; }
        .sd-pos-qty-input { width: 64px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; font-size: 0.8rem; font-weight: 600; text-align: center; padding: 0.25rem 0.2rem; outline: none; min-width: 0; }
        .sd-pos-qty-input:focus { border-color: var(--mb-amber-500); box-shadow: 0 0 0 0.15rem rgba(244,162,97,0.2); }
        .sd-pos-qty-input::-webkit-outer-spin-button, .sd-pos-qty-input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .sd-pos-cart-row-sub { font-size: 0.85rem; font-weight: 600; color: #fff; }
        .sd-pos-cart-row-del { background: none; border: none; color: rgba(255,255,255,0.3); font-size: 1rem; cursor: pointer; padding: 0.15rem 0.25rem; margin-left: 0.25rem; }
        .sd-pos-cart-row-del:hover { color: var(--mb-error); }
        .sd-pos-cart-row-edit { background: none; border: none; color: var(--mb-amber-500); font-size: 0.95rem; cursor: pointer; padding: 0.15rem 0.3rem; margin-left: 0.25rem; border-radius: 4px; }
        .sd-pos-cart-row-edit:hover { background: rgba(244,162,97,0.15); }
        .sd-pos-cart-row-excluded { font-size: 0.7rem; color: var(--mb-amber-500); margin-top: 0.3rem; display: flex; align-items: center; gap: 0.3rem; }
        .sd-pos-cart-row-excluded .sd-pos-cart-row-excluded-clear { background: none; border: none; color: rgba(255,255,255,0.35); font-size: 0.8rem; cursor: pointer; padding: 0; line-height: 1; }

        .sd-pos-customer-bar { display: flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.85rem; background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.78rem; color: rgba(255,255,255,0.6); }
        .sd-pos-customer-bar i { color: var(--mb-amber-500); font-size: 0.85rem; }
        .sd-pos-customer-name { flex: 1; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sd-pos-customer-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 5px; color: rgba(255,255,255,0.5); padding: 0.2rem 0.4rem; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; }
        .sd-pos-customer-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }

        .sd-customer-modal .modal-content { background: var(--mb-blue-900); color: #E8ECF1; border: 1px solid rgba(255,255,255,0.1); z-index: 2001; }
        .sd-customer-modal .modal-backdrop { z-index: 1999; }
        .sd-customer-modal .modal-header { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sd-customer-modal .modal-footer { border-top: 1px solid rgba(255,255,255,0.1); }
        .sd-customer-modal .modal-title { color: #fff; font-size: 1rem; }
        .sd-customer-search { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
        .sd-customer-search input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; padding: 0.5rem 0.7rem; font-size: 0.85rem; outline: none; }
        .sd-customer-search input::placeholder { color: rgba(255,255,255,0.3); }
        .sd-customer-search input:focus { border-color: var(--mb-amber-500); }
        .sd-customer-list { max-height: 240px; overflow-y: auto; }
        .sd-customer-item { display: flex; align-items: center; justify-content: space-between; padding: 0.55rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; border-radius: 6px; transition: background 0.12s; }
        .sd-customer-item:hover { background: rgba(255,255,255,0.06); }
        .sd-customer-item-name { font-size: 0.88rem; font-weight: 500; color: #fff; }
        .sd-customer-item-doc { font-size: 0.75rem; color: rgba(255,255,255,0.4); }
        .sd-customer-item-default { font-size: 0.65rem; background: var(--mb-amber-500); color: #1A1A1A; padding: 0.08rem 0.4rem; border-radius: 8px; font-weight: 700; margin-left: 0.4rem; }
        .sd-customer-empty { text-align: center; color: rgba(255,255,255,0.4); font-style: italic; padding: 1.2rem 1rem; font-size: 0.85rem; }
        .sd-customer-create-btn { width: 100%; background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px; color: rgba(255,255,255,0.6); padding: 0.6rem; font-size: 0.85rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: all 0.15s; margin-top: 0.5rem; }
        .sd-customer-create-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.3); }

        .sd-customer-form { display: none; }
        .sd-customer-form .form-label { font-size: 0.78rem; color: rgba(255,255,255,0.6); font-weight: 500; }
        .sd-customer-form .form-control { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; font-size: 0.85rem; padding: 0.5rem 0.7rem; }
        .sd-customer-form .form-control:focus { background: rgba(255,255,255,0.08); border-color: var(--mb-amber-500); color: #fff; }
        .sd-customer-form .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .sd-customer-form-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
        .sd-pos-cart-row-excluded .sd-pos-cart-row-excluded-clear:hover { color: var(--mb-error); }

        /* Cart footer */
        .sd-pos-cart-footer { border-top: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; padding: 0.6rem 0.75rem 0.75rem; }
        .sd-pos-notes-toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: rgba(255,255,255,0.5); cursor: pointer; margin-bottom: 0.4rem; padding: 0.3rem 0.5rem; border-radius: 6px; transition: all 0.15s; background: none; border: none; width: 100%; text-align: left; }
        .sd-pos-notes-toggle:hover { color: #fff; background: rgba(255,255,255,0.06); }
        .sd-pos-notes-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #fff; padding: 0.4rem 0.5rem; font-size: 0.78rem; margin-bottom: 0.5rem; resize: none; min-height: 60px; font-family: inherit; }
        .sd-pos-notes-input::placeholder { color: rgba(255,255,255,0.3); }
        .sd-pos-notes-input:focus { outline: none; border-color: var(--mb-amber-400); }

        .sd-pos-total { display: flex; align-items: baseline; justify-content: space-between; margin: 0.3rem 0 0.6rem; padding-top: 0.4rem; border-top: 1px dashed rgba(255,255,255,0.12); }
        .sd-pos-total-label { font-size: 0.78rem; color: rgba(255,255,255,0.5); font-weight: 500; }
        .sd-pos-total-val { font-size: 1.6rem; font-weight: 700; color: #fff; }

        .sd-pos-pago-label { font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.5); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .sd-pos-pago-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.35rem; margin-bottom: 0.5rem; }
        .sd-pos-pago-opt { background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 0.45rem 0.3rem; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; color: rgba(255,255,255,0.6); }
        .sd-pos-pago-opt:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: #fff; }
        .sd-pos-pago-opt.selected { background: var(--mb-amber-500); border-color: var(--mb-amber-500); color: #1A1A1A; }
        .sd-pos-pago-opt i { font-size: 1.1rem; }
        .sd-pos-pago-opt span { font-size: 0.7rem; font-weight: 600; }

        .sd-pos-btn-pagar { width: 100%; padding: 0.7rem; border-radius: 10px; font-size: 0.92rem; font-weight: 700; background: var(--mb-success); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: 52px; box-shadow: 0 2px 10px rgba(42,157,143,0.35); transition: all 0.15s; letter-spacing: 0.02em; }
        .sd-pos-btn-pagar:hover:not(:disabled) { background: #249486; box-shadow: 0 4px 14px rgba(42,157,143,0.45); transform: translateY(-1px); }
        .sd-pos-btn-pagar:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

        .sd-pos-btn-hold { width: 100%; padding: 0.5rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; background: transparent; border: 1.5px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.35rem; min-height: 42px; margin-bottom: 0.5rem; transition: all 0.15s; }
        .sd-pos-btn-hold:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.3); color: #fff; }

        /* Amount received + change */
        .sd-pos-received { margin-top: 0.4rem; margin-bottom: 0.5rem; padding: 0.5rem 0.6rem; background: rgba(255,255,255,0.04); border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
        .sd-pos-received-label { font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
        .sd-pos-received-input-wrap { display: flex; align-items: center; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 0 0.5rem; }
        .sd-pos-received-input-wrap:focus-within { border-color: var(--mb-amber-500); }
        .sd-pos-received-prefix { color: rgba(255,255,255,0.5); font-weight: 600; margin-right: 0.3rem; }
        .sd-pos-received-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 0.95rem; font-weight: 600; padding: 0.4rem 0; outline: none; min-width: 0; }
        .sd-pos-received-input::placeholder { color: rgba(255,255,255,0.3); }
        .sd-pos-received-input:read-only { color: rgba(255,255,255,0.5); cursor: not-allowed; }
        .sd-pos-change-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 0.5rem; padding-top: 0.4rem; border-top: 1px dashed rgba(255,255,255,0.12); }
        .sd-pos-change-label { font-size: 0.72rem; color: rgba(255,255,255,0.5); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
        .sd-pos-change-val { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .sd-pos-change-val.negative { color: var(--mb-error); }
        .sd-pos-change-val.warn { color: var(--mb-amber-500); }

        /* Recipe edit modal */
        .sd-recipe-modal { background: var(--mb-blue-900); color: #E8ECF1; border: 1px solid rgba(255,255,255,0.1); }
        .sd-recipe-modal .modal-header { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sd-recipe-modal .modal-footer { border-top: 1px solid rgba(255,255,255,0.1); }
        .sd-recipe-modal .modal-title { color: #fff; font-size: 1rem; }
        .sd-recipe-help { font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-bottom: 0.6rem; }
        .sd-recipe-check { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.4rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .sd-recipe-check:hover { background: rgba(255,255,255,0.05); }
        .sd-recipe-check input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--mb-amber-500); }
        .sd-recipe-empty { font-size: 0.85rem; color: rgba(255,255,255,0.5); font-style: italic; padding: 0.5rem 0; }

        /* Recipe tree (combo view) */
        .sd-recipe-tree { font-size: 0.88rem; }
        .sd-recipe-tree-root { font-weight: 700; color: #fff; padding: 0.3rem 0; margin-bottom: 0.3rem; }
        .sd-recipe-tree-root i { color: var(--mb-amber-500); margin-right: 0.3rem; }
        .sd-recipe-tree-list, .sd-recipe-tree-leaves { list-style: none; padding-left: 1.1rem; margin: 0; border-left: 1px solid rgba(255,255,255,0.12); }
        .sd-recipe-tree-product { padding: 0.25rem 0 0.25rem 0.3rem; }
        .sd-recipe-tree-product-name { font-weight: 600; color: var(--mb-amber-500); padding: 0.15rem 0; }
        .sd-recipe-tree-product-name i { margin-right: 0.3rem; opacity: 0.85; }
        .sd-recipe-tree-connector { color: rgba(255,255,255,0.35); font-family: monospace; margin-right: 0.25rem; user-select: none; }
        .sd-recipe-tree-leaf { padding: 0.1rem 0; }
        .sd-recipe-tree-leaf-connector { display: inline-block; min-width: 1.2rem; }
        .sd-recipe-tree-empty-leaf { color: rgba(255,255,255,0.45); font-style: italic; font-size: 0.82rem; padding: 0.15rem 0 0.15rem 1.2rem; }

        /* Inline add-on tree (in cart rows) */
        .sd-addon-tree { margin-top: 0.4rem; padding: 0.4rem 0.5rem; background: rgba(255,255,255,0.03); border-radius: 6px; border: 1px solid rgba(255,255,255,0.06); }
        .sd-addon-tree-label { font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.55); margin-bottom: 0.3rem; }
        .sd-addon-tree-list { list-style: none; padding-left: 1rem; margin: 0; border-left: 1px solid rgba(255,255,255,0.1); }
        .sd-addon-tree-item { padding: 0.2rem 0; font-size: 0.78rem; color: #fff; }
        .sd-addon-tree-product-name { font-weight: 600; color: var(--mb-amber-500); margin: 0.15rem 0; }
        .sd-addon-tree-sublist { list-style: none; padding-left: 1rem; margin: 0; border-left: 1px solid rgba(255,255,255,0.08); }
        .sd-addon-tree-subitem { padding: 0.15rem 0; font-size: 0.75rem; }

        .sd-recipe-observation { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid rgba(255,255,255,0.1); }
        .sd-recipe-observation-label { font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.6); margin-bottom: 0.35rem; }
        .sd-recipe-observation-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #fff; padding: 0.5rem 0.6rem; font-size: 0.85rem; resize: vertical; min-height: 60px; font-family: inherit; }
        .sd-recipe-observation-input::placeholder { color: rgba(255,255,255,0.3); }
        .sd-recipe-observation-input:focus { outline: none; border-color: var(--mb-amber-400); }

        /* Add-on modal */
        .sd-addon-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sd-addon-row:last-child { border-bottom: none; }
        .sd-addon-row-info { flex: 1; min-width: 0; }
        .sd-addon-row-name { font-size: 0.88rem; font-weight: 600; color: #fff; }
        .sd-addon-row-price { font-size: 0.78rem; color: var(--mb-amber-500); font-weight: 600; }
        .sd-addon-row-add { background: var(--mb-success); border: none; color: #fff; border-radius: 6px; padding: 0.35rem 0.7rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; min-width: 70px; justify-content: center; transition: all 0.15s; }
        .sd-addon-row-add:hover { background: #249486; }
        .sd-addon-row-add.added { background: #2A9D8F; pointer-events: none; }
        .sd-addon-empty { text-align: center; color: rgba(255,255,255,0.5); font-style: italic; padding: 1.5rem 1rem; font-size: 0.9rem; }
        .sd-pos-cart-row-addon { background: none; border: none; color: var(--mb-amber-500); font-size: 0.95rem; cursor: pointer; padding: 0.15rem 0.3rem; margin-left: 0.25rem; border-radius: 4px; }
        .sd-pos-cart-row-addon:hover { background: rgba(244,162,97,0.15); }

        /* Add-on modal — search + grid */
        .sd-addon-search { padding: 0 0 0.5rem; position: relative; }
        .sd-addon-search i { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3); font-size: 0.85rem; pointer-events: none; }
        .sd-addon-search-input { width: 100%; padding: 0.45rem 0.7rem 0.45rem 2.1rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #fff; font-size: 0.85rem; }
        .sd-addon-search-input::placeholder { color: rgba(255,255,255,0.3); }
        .sd-addon-search-input:focus { outline: none; border-color: var(--mb-amber-400); }
        .sd-addon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; max-height: 400px; overflow-y: auto; }
        .sd-addon-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.6rem; text-align: center; cursor: pointer; transition: all 0.12s; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
        .sd-addon-card:hover { border-color: var(--mb-amber-400); background: rgba(244,162,97,0.08); transform: translateY(-1px); }
        .sd-addon-card:active { transform: scale(0.96); }
        .sd-addon-card-icon { font-size: 1.3rem; }
        .sd-addon-card-name { font-size: 0.75rem; font-weight: 600; color: #fff; line-height: 1.1; }
        .sd-addon-card-price { font-size: 0.72rem; color: var(--mb-amber-500); font-weight: 700; }
        .sd-addon-card-type { font-size: 0.55rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.05em; }
        .sd-addon-empty { text-align: center; color: rgba(255,255,255,0.5); font-style: italic; padding: 1.5rem 1rem; font-size: 0.9rem; }
        .sd-pos-cart-row-addon { background: none; border: none; color: var(--mb-amber-500); font-size: 0.95rem; cursor: pointer; padding: 0.15rem 0.3rem; margin-left: 0.25rem; border-radius: 4px; }
        .sd-pos-cart-row-addon:hover { background: rgba(244,162,97,0.15); }

        .sd-pos-cart-fab { display: none; }
        @media (max-width: 767.98px) {
            .sd-pos-page { height: auto; min-height: 0; }
            .sd-pos-layout { flex-direction: column; overflow: visible; }
            .sd-pos-products { flex: none; overflow: visible; }
            .sd-pos-grid { flex: none; overflow: visible; grid-template-columns: repeat(3, 1fr); }

            .sd-pos-cart-row { display: flex; flex-direction: column; gap: 0.3rem; }
            .sd-pos-cart-row-name { white-space: normal; overflow: visible; text-overflow: unset; }

            .sd-pos-cart {
                position: fixed;
                top: var(--mb-nav-height);
                right: 0;
                bottom: 0;
                width: 88%;
                max-width: 360px;
                height: auto;
                max-height: none;
                transform: translateX(100%);
                transition: transform 0.28s ease;
                z-index: 1055;
                border-top: none;
                border-left: 1px solid rgba(255,255,255,0.08);
                box-shadow: -4px 0 20px rgba(0,0,0,0.35);
            }
            .sd-pos-cart.open { transform: translateX(0); }

            .sd-pos-cart-backdrop {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.5);
                z-index: 1050;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.2s, visibility 0.2s;
            }
            .sd-pos-cart-backdrop.open { opacity: 1; visibility: visible; }

            .sd-pos-cart-fab {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                position: fixed;
                bottom: 1rem;
                right: 1rem;
                z-index: 1045;
                background: var(--mb-blue-900);
                color: #fff;
                border: none;
                border-radius: 50px;
                padding: 0.7rem 1.1rem;
                box-shadow: 0 4px 16px rgba(0,0,0,0.3);
                font-weight: 600;
                cursor: pointer;
                min-height: 48px;
            }
            .sd-pos-cart-fab-total { font-size: 0.9rem; }
            .sd-pos-cart-fab-count {
                background: var(--mb-amber-500);
                color: #1A1A1A;
                border-radius: 12px;
                padding: 0.1rem 0.5rem;
                font-size: 0.75rem;
                font-weight: 700;
            }

            .sd-pos-cart-close { display: flex; }
        }
        @media (min-width: 992px) {
            .sd-pos-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 1400px) {
            .sd-pos-grid { grid-template-columns: repeat(4, 1fr); }
            .sd-pos-cart { width: 500px; }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script th:inline="javascript">
        var cart = [];
        var selectedMetodo = null;
        var recipeData = /*[[${recipeData}]]*/ {productIngredients: {}, comboProductIds: {}};
        var posAddOnProducts = /*[[${posAddOnProducts}]]*/ [];
        var adicionModalEl = document.getElementById('adicionModal');
        var adicionModal = adicionModalEl && window.bootstrap ? new bootstrap.Modal(adicionModalEl) : null;
        var adicionTargetIdx = -1;

        // Prefill from resume
        var prefill = /*[[${prefillCart}]]*/ null;
        if (prefill && Array.isArray(prefill)) {
            prefill.forEach(function(item) {
                if (item.productId) {
                    cart.push({type: 'product', id: item.productId, name: item.productName, price: item.salePrice, quantity: item.quantity, excludedIngredients: [], observation: '', parentIdx: -1});
                } else if (item.comboId) {
                    cart.push({type: 'combo', id: item.comboId, name: item.comboName, price: item.salePrice, quantity: item.quantity, excludedIngredients: [], observation: '', parentIdx: -1});
                }
            });
        }

        function fmt(val) {
            return '$' + Number(val).toLocaleString('es-CO', {minimumFractionDigits: 0, maximumFractionDigits: 0});
        }

        function getTotal() {
            return cart.reduce(function(s, i) { return s + i.quantity * i.price; }, 0);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function(c) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
            });
        }

        function canEditRecipe(item) {
            if (!recipeData) return false;
            if (item.type === 'product') {
                var list = recipeData.productIngredients[String(item.id)];
                return Array.isArray(list) && list.length > 0;
            } else if (item.type === 'combo') {
                var pids = recipeData.comboProductIds[String(item.id)];
                return Array.isArray(pids) && pids.length > 0;
            }
            return false;
        }

        function getProductName(productId) {
            if (!recipeData || !recipeData.productNames) return null;
            return recipeData.productNames[String(productId)] || null;
        }

        function getProductIngredients(productId) {
            if (!recipeData) return [];
            var list = recipeData.productIngredients[String(productId)];
            return Array.isArray(list) ? list : [];
        }

        function getComboAllProducts(comboId) {
            if (!recipeData) return [];
            var pids = recipeData.comboProductIds[String(comboId)] || [];
            return pids.map(function(pid) {
                var ings = recipeData.productIngredients[String(pid)] || [];
                return {
                    productId: parseInt(pid),
                    name: getProductName(pid) || ('Product #' + pid),
                    ingredients: ings
                };
            });
        }

        function addToCart(type, id, name, price, parentIdx) {
            if (parentIdx === undefined) parentIdx = -1;
            var existing = cart.find(function(i) { return i.type === type && i.id === id && i.parentIdx === parentIdx; });
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({type: type, id: id, name: name, price: price, quantity: 1, excludedIngredients: [], observation: '', parentIdx: parentIdx});
            }
            render();
        }

        function changeQty(idx, delta) {
            cart[idx].quantity += delta;
            if (cart[idx].quantity <= 0) {
                if (cart[idx].parentIdx === -1) {
                    for (var i = cart.length - 1; i >= 0; i--) {
                        if (cart[i].parentIdx === idx) cart.splice(i, 1);
                    }
                }
                cart.splice(idx, 1);
                cart.forEach(function(item) {
                    if (item.parentIdx > idx) item.parentIdx--;
                });
            }
            render();
        }

        function removeItem(idx) {
            if (cart[idx] && cart[idx].parentIdx === -1) {
                for (var i = cart.length - 1; i >= 0; i--) {
                    if (cart[i].parentIdx === idx) cart.splice(i, 1);
                }
            }
            cart.splice(idx, 1);
            cart.forEach(function(item) {
                if (item.parentIdx > idx) item.parentIdx--;
            });
            render();
        }

        function clearCart() {
            if (cart.length === 0) return;
            if (!confirm('Clear cart?')) return;
            cart = [];
            render();
        }

        function render() {
            var items = document.getElementById('cartItems');
            var empty = document.getElementById('cartEmpty');
            var footer = document.getElementById('cartFooter');
            var count = document.getElementById('cartCount');
            var totalVal = document.getElementById('cartTotalVal');
            var chargeBtn = document.getElementById('chargeBtn');
            var chargeLabel = document.getElementById('chargeLabel');

            count.textContent = cart.length;
            var fabCount = document.getElementById('cartFabCount');
            var fabTotal = document.getElementById('cartFabTotal');
            if (fabCount) fabCount.textContent = cart.length;
            if (fabTotal) fabTotal.textContent = fmt(getTotal());

            if (cart.length === 0) {
                empty.style.display = '';
                items.querySelectorAll('.sd-pos-cart-row, .sd-recipe-tree-list').forEach(function(el) { el.remove(); });
                footer.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            footer.style.display = '';
            items.querySelectorAll('.sd-pos-cart-row, .sd-recipe-tree-list').forEach(function(el) { el.remove(); });

            // Render: first all parents, then their add-ons indented
            var parentIndices = [];
            cart.forEach(function(item, i) {
                if (item.parentIdx === -1) parentIndices.push(i);
            });

            // Also collect orphaned add-ons (parentIdx references removed parent)
            var validParentIndices = new Set(parentIndices);
            cart.forEach(function(item, i) {
                if (item.parentIdx !== -1 && !validParentIndices.has(item.parentIdx)) {
                    parentIndices.push(i); // render as top-level
                }
            });

            parentIndices.forEach(function(i) {
                var item = cart[i];
                var row = document.createElement('div');
                row.className = 'sd-pos-cart-row';
                var editBtnHtml = canEditRecipe(item) && item.parentIdx === -1
                    ? '<button type="button" class="sd-pos-cart-row-edit" data-act="edit-recipe" data-idx="' + i + '" title="Edit recipe"><i class="bi bi-list-check"></i></button>'
                    : '';
                var addOnBtnHtml = canEditRecipe(item) && item.parentIdx === -1
                    ? '<button type="button" class="sd-pos-cart-row-addon" data-act="open-adicion" data-idx="' + i + '" title="Add add-ons"><i class="bi bi-plus-circle"></i></button>'
                    : '';
                var excludedHtml = '';
                if (item.excludedIngredients && item.excludedIngredients.length > 0) {
                    excludedHtml = '<div class="sd-pos-cart-row-excluded">' +
                        '<i class="bi bi-slash-circle"></i>' +
                        '<span>Without: ' + escapeHtml(item.excludedIngredients.map(function(e){return e.name;}).join(', ')) + '</span>' +
                        '<button type="button" class="sd-pos-cart-row-excluded-clear" data-act="clear-excluded" data-idx="' + i + '" title="Clear exclusions">&times;</button>' +
                        '</div>';
                }
                var observationHtml = '';
                if (item.observation && item.observation.length > 0) {
                    observationHtml = '<div class="sd-pos-cart-row-excluded">' +
                        '<i class="bi bi-chat-left-text"></i>' +
                        '<span>Note: ' + escapeHtml(item.observation) + '</span>' +
                        '<button type="button" class="sd-pos-cart-row-excluded-clear" data-act="clear-observation" data-idx="' + i + '" title="Clear note">&times;</button>' +
                        '</div>';
                }
                row.innerHTML =
                    '<div class="sd-pos-cart-row-name">' + escapeHtml(item.name) + '</div>' +
                    '<div class="sd-pos-cart-row-price">' + fmt(item.price) + ' each</div>' +
                    excludedHtml +
                    observationHtml +
                    '<div class="sd-pos-cart-row-controls">' +
                        '<div class="sd-pos-qty-group">' +
                            '<button type="button" class="sd-pos-qty-btn" data-act="minus" data-idx="' + i + '">&minus;</button>' +
                            '<input type="number" min="0.0001" step="0.0001" class="sd-pos-qty-val sd-pos-qty-input" value="' + item.quantity + '" data-idx="' + i + '" aria-label="Quantity">' +
                            '<button type="button" class="sd-pos-qty-btn" data-act="plus" data-idx="' + i + '">+</button>' +
                        '</div>' +
                        '<div style="display:flex;align-items:center;gap:0.25rem">' +
                            '<span class="sd-pos-cart-row-sub">' + fmt(item.quantity * item.price) + '</span>' +
                            addOnBtnHtml +
                            editBtnHtml +
                            '<button type="button" class="sd-pos-cart-row-del" data-act="del" data-idx="' + i + '">&times;</button>' +
                        '</div>' +
                    '</div>';
                items.appendChild(row);

                // Render add-ons as tree (like recipe tree)
                var addons = [];
                cart.forEach(function(c, ci) {
                    if (c.parentIdx === i) addons.push({idx: ci, item: c});
                });
                if (addons.length > 0) {
                    var treeUl = document.createElement('ul');
                    treeUl.className = 'sd-recipe-tree-list';
                    treeUl.style.paddingLeft = '1.2rem';
                    treeUl.style.margin = '0.2rem 0 0.3rem 0';
                    addons.forEach(function(a, ai) {
                        var isLast = ai === addons.length - 1;
                        var connector = isLast ? '\u2514\u2500' : '\u251C\u2500';
                        var leafConn = isLast ? '\u00a0\u00a0' : '\u2502\u00a0';
                        var li = document.createElement('li');
                        li.className = 'sd-recipe-tree-product';
                        li.style.padding = '0.2rem 0';
                        li.innerHTML =
                            '<span class="sd-recipe-tree-connector" style="font-size:0.72rem">' + connector + '</span>' +
                            '<div style="display:inline-flex;align-items:center;gap:0.4rem;flex:1;vertical-align:middle">' +
                                '<span style="color:#fff;font-size:0.78rem;font-weight:500">' + escapeHtml(a.item.name) + '</span>' +
                                '<span style="color:rgba(255,255,255,0.5);font-size:0.7rem">' + fmt(a.item.price) + '</span>' +
                                '<div class="sd-pos-qty-group" style="margin-left:auto">' +
                                    '<button type="button" class="sd-pos-qty-btn" data-act="minus" data-idx="' + a.idx + '">&minus;</button>' +
                                    '<input type="number" min="0.0001" step="0.0001" class="sd-pos-qty-val sd-pos-qty-input" value="' + a.item.quantity + '" data-idx="' + a.idx + '" aria-label="Quantity">' +
                                    '<button type="button" class="sd-pos-qty-btn" data-act="plus" data-idx="' + a.idx + '">+</button>' +
                                '</div>' +
                                '<span style="font-size:0.8rem;font-weight:600;color:#fff">' + fmt(a.item.quantity * a.item.price) + '</span>' +
                                '<button type="button" class="sd-pos-cart-row-del" data-act="del" data-idx="' + a.idx + '">&times;</button>' +
                            '</div>';
                        treeUl.appendChild(li);
                    });
                    items.appendChild(treeUl);
                }
            });

            items.querySelectorAll('.sd-pos-qty-input').forEach(function(input) {
                input.addEventListener('input', function() {
                    var idx = parseInt(this.dataset.idx);
                    if (!isNaN(idx) && cart[idx]) {
                        var q = parseNum(this.value);
                        if (!(q > 0)) { q = 1; this.value = q; }
                        cart[idx].quantity = q;
                        render();
                    }
                });
            });

            var total = getTotal();
            totalVal.textContent = fmt(total);
            chargeLabel.textContent = 'CHARGE ' + fmt(total);
            var cashValid = selectedMetodo !== 'EFECTIVO' || getReceivedValue() >= total;
            chargeBtn.disabled = !selectedMetodo || !cashValid;
            updateChange();
        }

        // Product click → add to cart
        document.getElementById('productGrid').addEventListener('click', function(e) {
            var item = e.target.closest('.sd-pos-item');
            if (!item) return;
            addToCart(item.dataset.type, parseInt(item.dataset.id), item.dataset.name, parseFloat(item.dataset.price));
            item.style.transform = 'scale(0.94)';
            setTimeout(function() { item.style.transform = ''; }, 120);
        });

        // Qty controls
        document.getElementById('cartItems').addEventListener('click', function(e) {
            var btn = e.target.closest('[data-act]');
            if (!btn) return;
            var idx = parseInt(btn.dataset.idx);
            if (btn.dataset.act === 'plus') changeQty(idx, 1);
            else if (btn.dataset.act === 'minus') changeQty(idx, -1);
            else if (btn.dataset.act === 'del') removeItem(idx);
            else if (btn.dataset.act === 'edit-recipe') openRecipeEditor(idx);
            else if (btn.dataset.act === 'clear-excluded') { cart[idx].excludedIngredients = []; render(); }
            else if (btn.dataset.act === 'clear-observation') { cart[idx].observation = ''; render(); }
            else if (btn.dataset.act === 'open-adicion') openAdicionModal(idx);
        });

        // Clear
        document.getElementById('clearBtn').addEventListener('click', clearCart);

        // Search
        document.getElementById('searchInput').addEventListener('input', function() {
            var q = this.value.toLowerCase();
            document.querySelectorAll('.sd-pos-item').forEach(function(el) {
                el.style.display = (el.dataset.name || '').toLowerCase().includes(q) ? '' : 'none';
            });
        });

        // Notes toggle
        document.getElementById('notesToggle').addEventListener('click', function() {
            var input = document.getElementById('notesInput');
            var label = document.getElementById('notesToggleLabel');
            if (input.style.display === 'none') {
                input.style.display = '';
                label.textContent = 'Hide note';
                input.focus();
            } else {
                input.style.display = 'none';
                label.textContent = 'Add note';
            }
        });

        // Payment selection
        document.querySelectorAll('.sd-pos-pago-opt').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.sd-pos-pago-opt').forEach(function(b) { b.classList.remove('selected'); });
                this.classList.add('selected');
                selectedMetodo = this.dataset.metodo;
                onPaymentMethodChanged();
                render();
            });
        });

        // Amount received / change
        function getReceivedValue() {
            var input = document.getElementById('amountReceivedInput');
            if (!input || input.readOnly) return parseFloat(input.value || '0') || 0;
            var v = parseFloat(input.value);
            return isNaN(v) ? 0 : v;
        }

        function updateChange() {
            var total = getTotal();
            var received = getReceivedValue();
            var change = received - total;
            var changeEl = document.getElementById('changeVal');
            if (selectedMetodo === 'EFECTIVO') {
                if (received === 0) {
                    changeEl.textContent = '$0';
                    changeEl.className = 'sd-pos-change-val';
                } else if (change < 0) {
                    changeEl.textContent = '\u2212' + fmt(-change);
                    changeEl.className = 'sd-pos-change-val negative';
                } else {
                    changeEl.textContent = fmt(change);
                    changeEl.className = 'sd-pos-change-val';
                }
            } else {
                changeEl.textContent = '$0';
                changeEl.className = 'sd-pos-change-val';
            }
        }

        function onPaymentMethodChanged() {
            var section = document.getElementById('receivedSection');
            var input = document.getElementById('amountReceivedInput');
            if (!selectedMetodo) {
                section.style.display = 'none';
                input.value = '';
                input.readOnly = false;
                return;
            }
            section.style.display = '';
            var total = getTotal();
            if (selectedMetodo === 'EFECTIVO') {
                input.readOnly = false;
                input.placeholder = '0.00';
                if (parseFloat(input.value) === total) input.value = '';
            } else {
                input.readOnly = true;
                input.value = total > 0 ? total.toFixed(2) : '0.00';
            }
            updateChange();
        }

        document.getElementById('amountReceivedInput').addEventListener('input', function() {
            updateChange();
            render();
        });

        // Recipe editor
        var editingCartIdx = -1;
        var recipeModal = null;
        var recipeModalEl = document.getElementById('recipeModal');
        if (recipeModalEl && window.bootstrap) {
            recipeModal = new bootstrap.Modal(recipeModalEl);
        }

        function openRecipeEditor(idx) {
            var item = cart[idx];
            if (!item || !canEditRecipe(item)) return;
            editingCartIdx = idx;

            var title = document.getElementById('recipeModalTitle');
            var body = document.getElementById('recipeModalBody');
            title.textContent = item.name + ' \u2014 Edit recipe';

            var excludedIds = (item.excludedIngredients || []).map(function(e) { return e.id; });
            var observation = item.observation || '';

            var observationHtml = '<div class="sd-recipe-observation">' +
                '<div class="sd-recipe-observation-label">Observation (optional)</div>' +
                '<textarea class="sd-recipe-observation-input" id="recipeObservation" rows="2" maxlength="200" placeholder="e.g., cut in half, no ice, extra hot">' +
                escapeHtml(observation) +
                '</textarea>' +
                '</div>';

            if (item.type === 'product') {
                var ings = getProductIngredients(item.id);
                var html = '<p class="sd-recipe-help">Uncheck the ingredients the customer does not want.</p>';
                html += '<div class="sd-recipe-tree">';
                html += renderProductBranch(item.name, ings, excludedIds);
                html += '</div>';
                html += observationHtml;
                body.innerHTML = html;
            } else if (item.type === 'combo') {
                var groups = getComboAllProducts(item.id);
                var html = '<p class="sd-recipe-help">Uncheck the ingredients the customer does not want.</p>';
                html += '<div class="sd-recipe-tree">';
                html += '<div class="sd-recipe-tree-root"><i class="bi bi-folder2-open"></i> ' + escapeHtml(item.name) + '</div>';
                html += '<ul class="sd-recipe-tree-list">';
                groups.forEach(function(g, idx) {
                    var isLast = idx === groups.length - 1;
                    html += renderComboProductNode(g, excludedIds, isLast);
                });
                html += '</ul>';
                html += '</div>';
                html += observationHtml;
                body.innerHTML = html;
            }

            if (recipeModal) recipeModal.show();
        }

        function renderComboProductNode(group, excludedIds, isLast) {
            var connector = isLast ? '\u2514\u2500' : '\u251C\u2500';
            var html = '<li class="sd-recipe-tree-product">';
            html += '<div class="sd-recipe-tree-product-name"><span class="sd-recipe-tree-connector">' + connector + '</span> <i class="bi bi-box"></i> ' + escapeHtml(group.name) + '</div>';
            if (group.ingredients.length > 0) {
                html += '<ul class="sd-recipe-tree-leaves">';
                group.ingredients.forEach(function(ing, j) {
                    var leafConnector = isLast ? '&nbsp;&nbsp;' : '\u2502&nbsp;';
                    var checked = excludedIds.indexOf(ing.id) === -1;
                    html += '<li class="sd-recipe-tree-leaf">';
                    html += '<span class="sd-recipe-tree-connector sd-recipe-tree-leaf-connector">' + leafConnector + '</span>';
                    html += '<label class="sd-recipe-check">';
                    html += '<input type="checkbox" data-ing-id="' + ing.id + '" data-ing-name="' + escapeHtml(ing.name) + '"' + (checked ? ' checked' : '') + '>';
                    html += '<span>' + escapeHtml(ing.name) + '</span>';
                    html += '</label>';
                    html += '</li>';
                });
                html += '</ul>';
            } else {
                html += '<div class="sd-recipe-tree-empty-leaf">(no customizations)</div>';
            }
            html += '</li>';
            return html;
        }

        function renderProductBranch(name, ingredients, excludedIds) {
            var html = '<div class="sd-recipe-tree-product">';
            html += '<div class="sd-recipe-tree-product-name"><i class="bi bi-box"></i> ' + escapeHtml(name) + '</div>';
            if (ingredients.length === 0) {
                html += '<div class="sd-recipe-tree-empty-leaf">(no customizations)</div>';
            } else {
                html += '<ul class="sd-recipe-tree-leaves">';
                ingredients.forEach(function(ing) {
                    var checked = excludedIds.indexOf(ing.id) === -1;
                    html += '<li class="sd-recipe-tree-leaf">';
                    html += '<label class="sd-recipe-check">';
                    html += '<input type="checkbox" data-ing-id="' + ing.id + '" data-ing-name="' + escapeHtml(ing.name) + '"' + (checked ? ' checked' : '') + '>';
                    html += '<span>' + escapeHtml(ing.name) + '</span>';
                    html += '</label>';
                    html += '</li>';
                });
                html += '</ul>';
            }
            html += '</div>';
            return html;
        }

        function saveRecipeEditor() {
            if (editingCartIdx < 0 || !cart[editingCartIdx]) return;
            var body = document.getElementById('recipeModalBody');
            var checks = body.querySelectorAll('input[type="checkbox"][data-ing-id]');
            var excluded = [];
            checks.forEach(function(cb) {
                if (!cb.checked) {
                    excluded.push({id: parseInt(cb.dataset.ingId), name: cb.dataset.ingName});
                }
            });
            var obsEl = document.getElementById('recipeObservation');
            var observation = obsEl ? obsEl.value.trim() : '';
            cart[editingCartIdx].excludedIngredients = excluded;
            cart[editingCartIdx].observation = observation;
            editingCartIdx = -1;
            if (recipeModal) recipeModal.hide();
            render();
        }

        var recipeSaveBtn = document.getElementById('recipeModalSave');
        if (recipeSaveBtn) recipeSaveBtn.addEventListener('click', saveRecipeEditor);

        // Adicion modal — search + grid of ALL products
        function openAdicionModal(cartIdx) {
            if (!posAddOnProducts || posAddOnProducts.length === 0) {
                alert('No products available');
                return;
            }

            var item = cart[cartIdx];
            if (!item) return;

            var titleEl = document.getElementById('adicionModalTitle');
            var body = document.getElementById('adicionModalBody');
            titleEl.textContent = 'Add add-on \u2014 ' + item.name;

            var html = '<div class="sd-addon-search">';
            html += '<i class="bi bi-search"></i>';
            html += '<input type="text" class="sd-addon-search-input" id="addonSearchInput" placeholder="Search products..." autofocus>';
            html += '</div>';
            html += '<div class="sd-addon-grid" id="addonGrid">';

            posAddOnProducts.forEach(function(p) {
                var icon = 'bi-box';
                if (p.productType === 'CON_RECETA') icon = 'bi-egg-fried';
                else if (p.productType === 'SIN_RECETA') icon = 'bi-cup-straw';
                else if (p.productType === 'ADICIONAL') icon = 'bi-plus-circle';

                html += '<div class="sd-addon-card" data-product-id="' + p.id + '" data-product-name="' + escapeHtml(p.name) + '" data-product-price="' + p.sellingPrice + '" data-parent-idx="' + cartIdx + '" data-search="' + escapeHtml(p.name).toLowerCase() + '">';
                html += '<div class="sd-addon-card-icon"><i class="bi ' + icon + '"></i></div>';
                html += '<div class="sd-addon-card-name">' + escapeHtml(p.name) + '</div>';
                html += '<div class="sd-addon-card-price">' + fmt(p.sellingPrice) + '</div>';
                html += '<div class="sd-addon-card-type">' + escapeHtml(p.productType) + '</div>';
                html += '</div>';
            });

            html += '</div>';

            body.innerHTML = html;
            if (adicionModal) adicionModal.show();

            // Search filter
            var searchInput = document.getElementById('addonSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    var q = this.value.toLowerCase();
                    body.querySelectorAll('.sd-addon-card').forEach(function(card) {
                        card.style.display = (card.dataset.search || '').includes(q) ? '' : 'none';
                    });
                });
                setTimeout(function() { searchInput.focus(); }, 200);
            }
        }

        document.getElementById('adicionModalBody').addEventListener('click', function(e) {
            var card = e.target.closest('.sd-addon-card');
            if (!card) return;

            var productId = parseInt(card.dataset.productId);
            var productName = card.dataset.productName;
            var productPrice = parseFloat(card.dataset.productPrice);
            var parentIdx = parseInt(card.dataset.parentIdx);

            // Make sure the parent is in the cart
            if (parentIdx < 0 || !cart[parentIdx]) {
                var existingParent = cart.find(function(c) { return c.type === 'product' && c.id === productId && c.parentIdx === -1; });
                if (existingParent) parentIdx = cart.indexOf(existingParent);
            }

            addToCart('product', productId, productName, productPrice, parentIdx);

            // Flash animation on the card
            card.style.background = 'rgba(42,157,143,0.3)';
            card.style.borderColor = 'var(--mb-success)';
            setTimeout(function() {
                card.style.background = '';
                card.style.borderColor = '';
            }, 400);
        });

        // Build form fields from cart
        function buildFormFields(containerId) {
            var container = document.getElementById(containerId);
            container.innerHTML = '';
            cart.forEach(function(item, i) {
                var typeInput = document.createElement('input');
                typeInput.type = 'hidden';
                typeInput.name = 'items[' + i + '].' + (item.type === 'combo' ? 'comboId' : 'productId');
                typeInput.value = item.id;
                container.appendChild(typeInput);

                var qtyInput = document.createElement('input');
                qtyInput.type = 'hidden';
                qtyInput.name = 'items[' + i + '].quantity';
                qtyInput.value = item.quantity;
                container.appendChild(qtyInput);

                if (item.excludedIngredients && item.excludedIngredients.length > 0) {
                    var names = item.excludedIngredients.map(function(e) { return e.name; }).join(', ');
                    var notesInput = document.createElement('input');
                    notesInput.type = 'hidden';
                    notesInput.name = 'items[' + i + '].notes';
                    notesInput.value = 'Without: ' + names;
                    container.appendChild(notesInput);
                }

                var obsInput = document.createElement('input');
                obsInput.type = 'hidden';
                obsInput.name = 'items[' + i + '].observation';
                obsInput.value = item.observation || '';
                container.appendChild(obsInput);
            });
        }

        // Charge (confirm)
        document.getElementById('chargeBtn').addEventListener('click', function() {
            if (cart.length === 0) { alert('Cart is empty'); return; }
            if (!selectedMetodo) { alert('Select a payment method'); return; }
            var total = getTotal();
            var received = getReceivedValue();
            if (selectedMetodo === 'EFECTIVO' && received < total) {
                alert('Amount received must be at least the total');
                return;
            }
            buildFormFields('formFields');
            document.getElementById('formPaymentMethod').value = selectedMetodo;
            document.getElementById('formObservations').value = document.getElementById('notesInput').value;
            document.getElementById('formAmountReceived').value = received.toFixed(2);
            document.getElementById('formCustomerId').value = selectedCustomerId || '';
            document.getElementById('saleForm').submit();
        });

        // Hold
        document.getElementById('holdBtn').addEventListener('click', function() {
            if (cart.length === 0) { alert('Cart is empty'); return; }
            buildFormFields('holdFormFields');
            document.getElementById('holdFormObservations').value = document.getElementById('notesInput').value;
            document.getElementById('holdFormCustomerId').value = selectedCustomerId || '';
            document.getElementById('holdForm').submit();
        });

        // --- Customer selector ---
        var defaultCustomerId = /*[[${defaultCustomerId}]]*/ null;
        var selectedCustomerId = defaultCustomerId;
        var customerModalEl = document.getElementById('customerModal');
        var customerModal = customerModalEl && window.bootstrap ? new bootstrap.Modal(customerModalEl) : null;
        if (!customerModal) console.error('Customer modal not initialized:', customerModalEl, window.bootstrap);
        var searchTimeout = null;

        document.getElementById('openCustomerModal').addEventListener('click', function() {
            document.getElementById('customerSearchInput').value = '';
            document.getElementById('customerList').innerHTML = '<div class="sd-customer-empty">Type to search customers</div>';
            document.getElementById('customerSearchView').style.display = 'block';
            document.getElementById('customerCreateView').style.display = 'none';
            document.getElementById('customerFormError').style.display = 'none';
            if (customerModal) customerModal.show();
        });

        document.getElementById('customerSearchInput').addEventListener('input', function() {
            var q = this.value.trim();
            clearTimeout(searchTimeout);
            if (q.length === 0) {
                document.getElementById('customerList').innerHTML = '<div class="sd-customer-empty">Type to search customers</div>';
                return;
            }
            searchTimeout = setTimeout(function() {
                fetch('/sale/pos/customer/search?q=' + encodeURIComponent(q))
                    .then(function(r) { return r.json(); })
                    .then(function(customers) {
                        var list = document.getElementById('customerList');
                        if (customers.length === 0) {
                            list.innerHTML = '<div class="sd-customer-empty">No customers found</div>';
                            return;
                        }
                        list.innerHTML = customers.map(function(c) {
                            var defaultBadge = c.default ? '<span class="sd-customer-item-default">Default</span>' : '';
                            return '<div class="sd-customer-item" data-id="' + c.id + '" data-name="' + escapeHtml(c.fullName) + '">' +
                                '<div><div class="sd-customer-item-name">' + escapeHtml(c.fullName) + defaultBadge + '</div>' +
                                '<div class="sd-customer-item-doc">' + escapeHtml(c.documentMasked || '') + '</div></div>' +
                                '</div>';
                        }).join('');
                    });
            }, 250);
        });

        document.getElementById('customerList').addEventListener('click', function(e) {
            var item = e.target.closest('.sd-customer-item');
            if (!item) return;
            selectCustomer(parseInt(item.dataset.id), item.dataset.name);
        });

        function selectCustomer(id, name) {
            selectedCustomerId = id;
            document.getElementById('customerDisplayName').textContent = name;
            if (customerModal) customerModal.hide();
        }

        document.getElementById('showCreateCustomer').addEventListener('click', function() {
            document.getElementById('customerSearchView').style.display = 'none';
            document.getElementById('customerCreateView').style.display = 'block';
            document.getElementById('customerFormError').style.display = 'none';
            document.getElementById('newCustomerName').value = '';
            document.getElementById('newCustomerDoc').value = '';
            document.getElementById('newCustomerPhone').value = '';
            document.getElementById('newCustomerName').focus();
        });

        document.getElementById('backToSearch').addEventListener('click', function() {
            document.getElementById('customerSearchView').style.display = 'block';
            document.getElementById('customerCreateView').style.display = 'none';
            document.getElementById('customerFormError').style.display = 'none';
        });

        document.getElementById('saveNewCustomer').addEventListener('click', function() {
            var name = document.getElementById('newCustomerName').value.trim();
            var doc = document.getElementById('newCustomerDoc').value.trim();
            var phone = document.getElementById('newCustomerPhone').value.trim();
            var errEl = document.getElementById('customerFormError');

            if (!name) { errEl.textContent = 'Name is required'; errEl.style.display = ''; return; }
            if (!doc) { errEl.textContent = 'Document is required'; errEl.style.display = ''; return; }

            fetch('/sale/pos/customer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [document.querySelector('meta[name="_csrf_header"]').content]: document.querySelector('meta[name="_csrf"]').content
                },
                body: JSON.stringify({fullName: name, document: doc, phone: phone || null})
            })
            .then(function(r) {
                if (!r.ok) return r.json().then(function(e) { throw new Error(e.message || 'Error creating customer'); });
                return r.json();
            })
            .then(function(c) {
                selectCustomer(c.id, c.fullName);
            })
            .catch(function(err) {
                errEl.textContent = err.message || 'Error creating customer';
                errEl.style.display = '';
            });
        });

        // Drawer controls (mobile)
        function openCartDrawer() {
            var cartEl = document.querySelector('.sd-pos-cart');
            var backdrop = document.getElementById('cartBackdrop');
            if (cartEl) cartEl.classList.add('open');
            if (backdrop) backdrop.classList.add('open');
        }
        function closeCartDrawer() {
            var cartEl = document.querySelector('.sd-pos-cart');
            var backdrop = document.getElementById('cartBackdrop');
            if (cartEl) cartEl.classList.remove('open');
            if (backdrop) backdrop.classList.remove('open');
        }
        var cartFab = document.getElementById('cartFab');
        if (cartFab) cartFab.addEventListener('click', openCartDrawer);
        var cartClose = document.getElementById('cartClose');
        if (cartClose) cartClose.addEventListener('click', closeCartDrawer);
        var cartBackdrop = document.getElementById('cartBackdrop');
        if (cartBackdrop) cartBackdrop.addEventListener('click', closeCartDrawer);

        // Initial render
        render();
    </script>
</body>
</html>
