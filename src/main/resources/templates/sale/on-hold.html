<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Hold Sales — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .oh-card { border: none; border-left: 4px solid var(--mb-amber-500); border-radius: var(--mb-radius); box-shadow: var(--mb-shadow-sm); background: #fff; transition: box-shadow 0.2s, transform 0.15s; }
        .oh-card:hover { box-shadow: var(--mb-shadow-lg); transform: translateY(-1px); }
        .oh-card .card-body { padding: 1.25rem; }
        .oh-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; }
        .oh-time { font-size: 1.5rem; font-weight: 700; color: var(--mb-blue-900); line-height: 1; }
        .oh-time small { display: block; font-size: 0.7rem; font-weight: 400; color: var(--mb-text-muted); margin-top: 0.15rem; }
        .oh-total { font-size: 1.2rem; font-weight: 700; color: var(--mb-success); text-align: right; }
        .oh-total small { display: block; font-size: 0.65rem; font-weight: 400; color: var(--mb-text-muted); margin-top: 0.1rem; }
        .oh-meta { display: flex; align-items: center; gap: 0.75rem; font-size: 0.78rem; color: var(--mb-text-muted); margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--mb-border-light); }
        .oh-items { margin-bottom: 1rem; }
        .oh-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; padding: 0.3rem 0.5rem; border-radius: 6px; }
        .oh-item:nth-child(odd) { background: var(--mb-blue-50); }
        .oh-item .qty { color: var(--mb-amber-500); font-weight: 700; min-width: 32px; }
        .oh-item .name { color: var(--mb-text); flex: 1; padding: 0 0.5rem; }
        .oh-item .price { color: var(--mb-text-muted); font-weight: 500; }
        .oh-actions { display: flex; gap: 0.5rem; }
    </style>
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="sd-page-header sd-fade sd-fade--1">
                    <div>
                        <h1 class="sd-page-title">On Hold</h1>
                        <p class="sd-page-desc">Sales waiting to be resumed</p>
                        <div class="sd-title-accent"></div>
                    </div>
                    <div class="sd-page-actions">
                        <a th:href="@{/sale/pos}" class="sd-btn">
                            <i class="bi bi-arrow-left"></i>Back to POS
                        </a>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(sales)}" class="sd-empty">
                    <div class="sd-empty-icon"><i class="bi bi-clock-history"></i></div>
                    <h3>No on-hold sales</h3>
                    <p>Sales put on hold will appear here.</p>
                </div>

                <div class="row g-4">
                    <div th:each="sale : ${sales}" class="col-md-6 col-xl-4">
                        <div class="card oh-card h-100">
                            <div class="card-body">
                                <div class="oh-top">
                                    <div class="oh-time">
                                        <span th:text="${#temporals.format(sale.saleDate, 'HH:mm')}">12:00</span>
                                        <small th:text="${#temporals.format(sale.saleDate, 'dd/MM/yyyy')}">01/01/2025</small>
                                    </div>
                                    <div class="oh-total">
                                        <span th:text="'$' + ${#numbers.formatDecimal(sale.total, 1, 0)}">$0</span>
                                        <small th:text="${sale.details.size() + ' items'}">3 items</small>
                                    </div>
                                </div>

                                <div class="oh-meta">
                                    <i class="bi bi-person"></i>
                                    <span th:text="${sale.cashierName}">Cashier</span>
                                </div>

                                <div class="oh-items">
                                    <div th:each="item : ${sale.details}" class="oh-item">
                                        <span class="qty" th:text="${item.quantity} + '\u00d7'">1×</span>
                                        <span class="name" th:text="${item.productName ?: item.comboName}">Item</span>
                                        <span class="price" th:text="'$' + ${#numbers.formatDecimal(item.totalPrice, 1, 0)}">$0</span>
                                    </div>
                                </div>

                                <div class="oh-actions">
                                    <form th:action="@{/sale/on-hold/{id}/resume(id=${sale.id})}" method="post" class="flex-fill d-flex">
                                        <button type="submit" class="sd-btn" style="width:100%">
                                            <i class="bi bi-play-fill"></i>Resume
                                        </button>
                                    </form>
                                    <form th:action="@{/sale/on-hold/{id}/delete(id=${sale.id})}" method="post">
                                        <button type="submit" class="sd-btn sd-btn--outline" style="min-height:var(--mb-touch-min)" onclick="return confirm('Delete this sale?')" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.sd-fade').forEach(function(el, i) {
                setTimeout(function() {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 80 * i);
            });
        });
    </script>
</body>
</html>
