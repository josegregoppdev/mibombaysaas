<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Hold Sales - MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .oh-card {
            border: none; border-left: 4px solid var(--mb-amber-500); border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: box-shadow 0.15s;
        }
        .oh-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .oh-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
        .oh-time { font-size: 1.4rem; font-weight: 700; color: var(--mb-blue-900); }
        .oh-total { font-size: 1.1rem; font-weight: 700; color: var(--mb-success); }
        .oh-cashier { font-size: 0.78rem; color: #6c757d; margin-bottom: 0.5rem; }
        .oh-items { margin-bottom: 0.75rem; }
        .oh-item { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 0.2rem 0; }
        .oh-item .qty { color: var(--mb-amber-500); font-weight: 600; min-width: 28px; }
        .oh-item .name { color: #1A1A1A; flex: 1; }
        .oh-item .price { color: #6c757d; font-weight: 500; }
        .oh-btn-resume {
            width: 100%; padding: 0.5rem; border-radius: 8px; font-weight: 600; font-size: 0.85rem;
            background: var(--mb-blue-500); border: none; color: #fff; cursor: pointer;
            transition: background 0.15s; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .oh-btn-resume:hover { background: var(--mb-blue-700); }
        .oh-empty { text-align: center; padding: 3rem 1rem; }
        .oh-empty i { font-size: 3rem; color: #dee2e6; display: block; margin-bottom: 0.75rem; }
        .oh-empty p { color: #6c757d; margin: 0; }
        .oh-delete { color: #dee2e6; transition: color 0.15s; }
        .oh-delete:hover { color: var(--mb-error); }
    </style>
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="display-6">On Hold</h1>
                        <p class="lead text-muted">Sales waiting to be resumed</p>
                    </div>
                    <a th:href="@{/sale/pos}" class="btn btn-primary">
                        <i class="bi bi-arrow-left me-2"></i>Back to POS
                    </a>
                </div>

                <div th:if="${#lists.isEmpty(sales)}" class="oh-empty">
                    <i class="bi bi-clock-history"></i>
                    <p class="fs-5 fw-medium">No on-hold sales</p>
                    <p class="text-muted small">Sales put on hold will appear here</p>
                </div>

                <div class="row g-3">
                    <div th:each="sale : ${sales}" class="col-md-6 col-xl-4">
                        <div class="card oh-card h-100">
                            <div class="card-body p-3">
                                <div class="oh-header">
                                    <span class="oh-time" th:text="${#temporals.format(sale.saleDate, 'HH:mm')}">12:00</span>
                                    <span class="oh-total" th:text="'$' + ${sale.total}">$0.00</span>
                                </div>
                                <div class="oh-cashier">
                                    <i class="bi bi-person me-1"></i><span th:text="${sale.cashierName}">Cashier</span>
                                    <span class="ms-2" th:text="${#temporals.format(sale.saleDate, 'dd/MM')}">01/01</span>
                                </div>
                                <div class="oh-items">
                                    <div th:each="item : ${sale.details}" class="oh-item">
                                        <span class="qty" th:text="${item.quantity} + '×'">1×</span>
                                        <span class="name" th:text="${item.productName ?: item.comboName}">Item</span>
                                        <span class="price" th:text="'$' + ${item.totalPrice}">$0.00</span>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <form th:action="@{/sale/on-hold/{id}/resume(id=${sale.id})}" method="post" class="flex-fill">
                                        <button type="submit" class="oh-btn-resume">
                                            <i class="bi bi-play-fill"></i>Resume
                                        </button>
                                    </form>
                                    <form th:action="@{/sale/on-hold/{id}/delete(id=${sale.id})}" method="post">
                                        <button type="submit" class="btn btn-sm oh-delete" onclick="return confirm('Delete this sale?')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
