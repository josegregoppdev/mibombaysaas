<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale #<span th:text="${sale.id}">1</span> — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="sd-page-header sd-fade sd-fade--1">
                    <div>
                        <h1 class="sd-page-title">Sale #<span th:text="${sale.id}">1</span></h1>
                        <p class="sd-page-desc" th:text="${sale.state.displayName}">Confirmed</p>
                        <div class="sd-title-accent"></div>
                    </div>
                    <div class="sd-page-actions">
                        <a th:href="@{/sale/history}" class="sd-btn sd-btn--outline">
                            <i class="bi bi-arrow-left"></i>Back
                        </a>
                    </div>
                </div>

                <div class="sd-info-grid sd-fade sd-fade--2">
                    <div class="sd-info-card">
                        <div class="sd-info-label">Cashier</div>
                        <div class="sd-info-value" th:text="${sale.cashierName}">Cashier</div>
                    </div>
                    <div class="sd-info-card">
                        <div class="sd-info-label">Date</div>
                        <div class="sd-info-value" th:text="${#temporals.format(sale.saleDate, 'dd/MM/yyyy HH:mm')}">01/01/2025</div>
                    </div>
                    <div class="sd-info-card">
                        <div class="sd-info-label">Customer</div>
                        <div class="sd-info-value" th:text="${sale.customerName ?: '\u2014'}">Customer</div>
                    </div>
                    <div class="sd-info-card">
                        <div class="sd-info-label">Payment</div>
                        <div class="sd-info-value">
                            <span class="sa-badge sa-badge--info" th:text="${sale.paymentMethod?.displayName ?: '\u2014'}">Cash</span>
                        </div>
                    </div>
                    <div class="sd-info-card">
                        <div class="sd-info-label">Total</div>
                        <div class="sd-info-value sd-info-value--accent" th:text="'$' + ${#numbers.formatDecimal(sale.total, 1, 2)}">$0.00</div>
                    </div>
                    <div class="sd-info-card" th:if="${sale.observations}">
                        <div class="sd-info-label">Notes</div>
                        <div class="sd-info-value" style="font-size:0.88rem" th:text="${sale.observations}">Note</div>
                    </div>
                </div>

                <div class="sd-list-card sd-fade sd-fade--3">
                    <div class="sd-list-card-glow"></div>
                    <div class="sd-list-card-header">
                        <div class="sd-list-card-title">
                            <i class="bi bi-list-ul"></i>
                            <span>Items</span>
                        </div>
                    </div>

                    <div class="sa-table-wrapper">
                        <table class="sa-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th class="sa-cell-right">Quantity</th>
                                    <th class="sa-cell-right">Unit Price</th>
                                    <th class="sa-cell-right">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="det : ${sale.details}" class="sd-table-row">
                                    <td>
                                        <span th:text="${det.productName ?: det.comboName}">Product</span>
                                        <span th:if="${det.comboName}" class="sa-badge sa-badge--profit-high" style="font-size:0.7rem;margin-left:0.5rem">COMBO</span>
                                    </td>
                                    <td class="sa-cell-right" th:text="${#numbers.formatDecimal(det.quantity, 1, 2)}">0.00</td>
                                    <td class="sa-cell-right" th:text="'$' + ${#numbers.formatDecimal(det.salePrice, 1, 2)}">$0.00</td>
                                    <td class="sa-cell-right" th:text="'$' + ${#numbers.formatDecimal(det.totalPrice, 1, 2)}">$0.00</td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr class="sd-table-row">
                                    <td colspan="3" class="sa-cell-right"><strong>Subtotal:</strong></td>
                                    <td class="sa-cell-right"><strong th:text="'$' + ${#numbers.formatDecimal(sale.total, 1, 2)}">$0.00</strong></td>
                                </tr>
                                <tr class="sd-table-row">
                                    <td colspan="3" class="sa-cell-right"><strong>TOTAL:</strong></td>
                                    <td class="sa-cell-right"><strong th:text="'$' + ${#numbers.formatDecimal(sale.total, 1, 2)}">$0.00</strong></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>

                <div class="sd-form-actions sd-fade sd-fade--4">
                    <a th:href="@{/sale/pos}" class="sd-btn">
                        <i class="bi bi-plus-circle"></i>New Sale
                    </a>
                    <a th:href="@{/sale/history}" class="sd-btn sd-btn--outline">
                        <i class="bi bi-arrow-left"></i>History
                    </a>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.sd-fade').forEach(function(el, i) {
                setTimeout(function() {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 80 * i);
            });
        });
    </script>
</body>
</html>
