<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="sd-page-header sd-fade sd-fade--1">
                    <div>
                        <h1 class="sd-page-title">Sales History</h1>
                        <p class="sd-page-desc">All registered sales</p>
                        <div class="sd-title-accent"></div>
                    </div>
                    <div class="sd-page-actions">
                        <a th:href="@{/sale/pos}" class="sd-btn">
                            <i class="bi bi-plus-circle"></i>New Sale
                        </a>
                    </div>
                </div>

                <div class="sd-list-card sd-fade sd-fade--2">
                    <div class="sd-list-card-glow"></div>

                    <div class="sa-table-wrapper">
                        <table class="sa-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Date</th>
                                    <th>Cashier</th>
                                    <th>Payment</th>
                                    <th class="sa-cell-right">Total</th>
                                    <th>Status</th>
                                    <th class="sa-cell-center">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${page.content}" class="sd-table-row">
                                    <td th:text="${s.id}">1</td>
                                    <td th:text="${#temporals.format(s.saleDate, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                                    <td th:text="${s.cashierName}">Cashier</td>
                                    <td>
                                        <span class="sa-badge" th:classappend="${s.paymentMethod?.name() == 'EFECTIVO'} ? 'sa-badge--profit-mid' : (${s.paymentMethod?.name() == 'TRANSFERENCIA'} ? 'sa-badge--profit-high' : 'sa-badge--info')"
                                              th:text="${s.paymentMethod?.displayName ?: '\u2014'}">Cash</span>
                                    </td>
                                    <td class="sa-cell-right" th:text="'$' + ${#numbers.formatDecimal(s.total, 1, 2)}">$0.00</td>
                                    <td>
                                        <span class="sa-badge" th:classappend="${s.state.name() == 'CONFIRMADA'} ? 'sa-badge--success' : (${s.state.name() == 'ANULADA'} ? 'sa-badge--danger' : 'sa-badge--warn')"
                                              th:text="${s.state.displayName}">Confirmed</span>
                                    </td>
                                    <td class="sa-cell-center">
                                        <a th:href="@{/sale/history/{id}(id=${s.id})}" class="sa-btn-icon" title="View details">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${page == null or #lists.isEmpty(page.content)}">
                                    <td colspan="7">
                                        <div class="sd-empty">
                                            <div class="sd-empty-icon"><i class="bi bi-receipt"></i></div>
                                            <h3>No sales registered</h3>
                                            <p>Make your first sale from the Point of Sale.</p>
                                            <a th:href="@{/sale/pos}" class="sd-btn">
                                                <i class="bi bi-plus-circle"></i>New Sale
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="sd-pagination" th:if="${page != null and page.totalPages > 1}">
                    <div class="sd-pagination-info">
                        Page <span th:text="${page.number + 1}">1</span> of <span th:text="${page.totalPages}">1</span>
                        (<span th:text="${page.totalElements}">0</span> results)
                    </div>
                    <div class="sd-pagination-links">
                        <a th:href="@{/sale/history(page=${page.number - 1})}"
                           class="sd-page-link" th:classappend="${page.first} ? 'sd-page-link--disabled' : ''">
                            <i class="bi bi-chevron-left"></i>Prev
                        </a>
                        <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                            <a th:href="@{/sale/history(page=${i})}"
                               class="sd-page-link" th:classappend="${i == page.number} ? 'sd-page-link--active' : ''"
                               th:text="${i + 1}">1</a>
                        </span>
                        <a th:href="@{/sale/history(page=${page.number + 1})}"
                           class="sd-page-link" th:classappend="${page.last} ? 'sd-page-link--disabled' : ''">
                            Next <i class="bi bi-chevron-right"></i>
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.sd-fade').forEach(function(el, i) {
                setTimeout(function() {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 80 * i);
            });
        });
    </script>
</body>
</html>
