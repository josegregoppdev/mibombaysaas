<div th:fragment="sidebarAdminOffcanvas">
    <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="sidebarOffcanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Admin</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#request.requestURI.endsWith('/admin/dashboard')} ? 'active'" th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2 me-2"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#request.requestURI.endsWith('/admin/empresas')} ? 'active'" th:href="@{/admin/empresas}">
                        <i class="bi bi-building me-2"></i>
                        Empresas
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>

<nav th:fragment="sidebarAdminInline" class="mb-sidebar">
    <div class="mb-sidebar-header">
        <h6 class="mb-0">Admin</h6>
    </div>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${#request.requestURI.endsWith('/admin/dashboard')} ? 'active'" th:href="@{/admin/dashboard}">
                <i class="bi bi-speedometer2 me-2"></i>
                Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${#request.requestURI.endsWith('/admin/empresas')} ? 'active'" th:href="@{/admin/empresas}">
                <i class="bi bi-building me-2"></i>
                Empresas
            </a>
        </li>
    </ul>
</nav>

<th:block th:fragment="sidebarAdmin">
    <th:block th:replace="~{fragments/sidebar-admin :: sidebarAdminOffcanvas}" />
    <th:block th:replace="~{fragments/sidebar-admin :: sidebarAdminInline}" />
</th:block>
