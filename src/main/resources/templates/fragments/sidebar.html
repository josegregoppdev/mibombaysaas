<div th:fragment="sidebarOffcanvas">
    <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="sidebarOffcanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Navegación</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-2"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" href="#">
                        <i class="bi bi-grid-3x3-gap me-2"></i>
                        Mesas
                        <span class="badge bg-secondary ms-auto">Pronto</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN')">
                    <a class="nav-link" th:href="@{/ingrediente}">
                        <i class="bi bi-basket me-2"></i>
                        Ingredientes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" href="#">
                        <i class="bi bi-book me-2"></i>

                        <span class="badge bg-secondary ms-auto">Pronto</span>

                <li class="nav-item">
                    <a class="nav-link disabled" href="#">
                        <i class="bi bi-receipt me-2"></i>

                <li class="nav-item mt-3">
                    <a class="nav-link" th:href="@{/cambiar-password}">
                        <i class="bi bi-key me-2"></i>
                        Cambiar contraseña
                    </a>

            </ul>
        </div>
    </div>
</div>
