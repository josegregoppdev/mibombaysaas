<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar-admin :: sidebarAdminOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar-admin :: sidebarAdminInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div class="mb-dashboard-header">
                    <h1 class="display-6">Panel de Administración</h1>
                    <p class="lead text-muted">Bienvenido al panel de control de MiBombay</p>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <i class="bi bi-building fs-1 text-primary mb-3"></i>
                                <h5 class="card-title">Total empresas</h5>
                                <p class="display-6 fw-bold text-primary" th:text="${total}">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <i class="bi bi-check-circle fs-1 text-success mb-3"></i>
                                <h5 class="card-title">Activas</h5>
                                <p class="display-6 fw-bold text-success" th:text="${activas}">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <i class="bi bi-x-circle fs-1 text-danger mb-3"></i>
                                <h5 class="card-title">Inactivas</h5>
                                <p class="display-6 fw-bold text-danger" th:text="${inactivas}">0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="bi bi-lightning-charge text-primary me-2"></i>
                            Acciones rápidas
                        </h5>
                        <a th:href="@{/admin/empresas}" class="btn btn-primary">
                            <i class="bi bi-building me-2"></i>Ver empresas
                        </a>
                        <a th:href="@{/cambiar-password}" class="btn btn-outline-primary">
                            <i class="bi bi-key me-2"></i>Cambiar contraseña
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
