<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar-admin :: sidebarAdminOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar-admin :: sidebarAdminInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="mb-dashboard-header">
                    <h1 class="display-6">Admin Panel</h1>
                    <p class="text-muted">MiBombay platform control panel</p>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm text-center">
                            <div class="card-body py-4">
                                <i class="bi bi-building fs-1 text-primary mb-3"></i>
                                <h5 class="card-title">Total</h5>
                                <p class="display-6 fw-bold text-primary mb-0" th:text="${total}">0</p>
                                <small class="text-muted">companies</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm text-center">
                            <div class="card-body py-4">
                                <i class="bi bi-check-circle fs-1 text-success mb-3"></i>
                                <h5 class="card-title">Active</h5>
                                <p class="display-6 fw-bold text-success mb-0" th:text="${activeCount}">0</p>
                                <small class="text-muted">companies</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm text-center">
                            <div class="card-body py-4">
                                <i class="bi bi-x-circle fs-1 text-danger mb-3"></i>
                                <h5 class="card-title">Inactive</h5>
                                <p class="display-6 fw-bold text-danger mb-0" th:text="${inactiveCount}">0</p>
                                <small class="text-muted">companies</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body d-flex flex-wrap gap-2">
                        <h5 class="card-title mb-0 me-3 align-self-center">
                            <i class="bi bi-lightning-charge me-2"></i>Quick actions
                        </h5>
                        <a th:href="@{/admin/companies}" class="btn btn-primary">
                            <i class="bi bi-building"></i>View companies
                        </a>
                        <a th:href="@{/change-password}" class="btn btn-outline-primary">
                            <i class="bi bi-key"></i>Change password
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
