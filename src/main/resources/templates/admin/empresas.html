<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas - MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 mb-sidebar-col">
                <nav class="mb-sidebar">
                    <div class="mb-sidebar-header">
                        <h6 class="mb-0">Admin</h6>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/dashboard}">
                                <i class="bi bi-speedometer2 me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/admin/empresas}">
                                <i class="bi bi-building me-2"></i>
                                Empresas
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div class="mb-dashboard-header">
                    <h1 class="display-6">Empresas registradas</h1>
                    <p class="lead text-muted">Listado de todas las empresas en la plataforma</p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Subdominio</th>
                                        <th>Correo</th>
                                        <th>Teléfono</th>
                                        <th>Estado</th>
                                        <th>Fecha creación</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="empresa : ${empresas}">
                                        <td th:text="${empresa.nombre}" class="fw-medium">Nombre</td>
                                        <td><code th:text="${empresa.subdominio}">subdominio</code></td>
                                        <td th:text="${empresa.correo}">correo</td>
                                        <td th:text="${empresa.telefono ?: '—'}">teléfono</td>
                                        <td>
                                            <span th:if="${empresa.activo}" class="badge bg-success">
                                                <i class="bi bi-check-circle me-1"></i>Activa
                                            </span>
                                            <span th:unless="${empresa.activo}" class="badge bg-danger">
                                                <i class="bi bi-x-circle me-1"></i>Inactiva
                                            </span>
                                        </td>
                                        <td th:text="${#temporals.format(empresa.createdAt, 'dd/MM/yyyy')}" class="text-muted">fecha</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(empresas)}">
                                        <td colspan="6" class="text-center text-muted py-4">
                                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                            No hay empresas registradas
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
