<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${recipe.id} ? 'Edit recipe' : 'New recipe'">Recipe - MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="mb-dashboard-header">
                    <h1 class="display-6" th:text="${recipe.id} ? 'Edit recipe' : 'New recipe'">Title</h1>
                    <p class="lead text-muted">Complete the form fields</p>
                </div>

                <form th:action="${recipe.id} ? @{/recipe/{id}(id=${recipe.id})} : @{/recipe}"
                      th:object="${recipe}" method="post">

                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="card-title mb-3">
                                <i class="bi bi-info-circle text-primary me-2"></i>Recipe information
                            </h5>
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label for="code" class="form-label">Code</label>
                                    <input type="text" class="form-control" id="code"
                                           th:field="*{code}"
                                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                                           placeholder="E.g.: HAM-001">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('code')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-md-9">
                                    <label for="name" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="name"
                                           th:field="*{name}"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                           placeholder="E.g.: Classic Hamburger">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('name')}" th:text="${err}">Error</div>
                                </div>

                                <div class="col-12">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" rows="2"
                                              th:field="*{description}"
                                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                              placeholder="Optional description"></textarea>
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('description')}" th:text="${err}">Error</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-list-ul text-primary me-2"></i>Ingredients
                                </h5>
                                <button type="button" class="btn btn-sm btn-outline-primary" id="addDetailBtn">
                                    <i class="bi bi-plus-lg me-1"></i>Add ingredient
                                </button>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-hover align-middle" id="detailsTable">
                                    <thead class="table-light">
                                        <tr>
                                            <th style="width: 35%">Ingredient</th>
                                            <th style="width: 15%">Quantity</th>
                                            <th style="width: 15%">Unit cost</th>
                                            <th style="width: 15%">Total cost</th>
                                            <th style="width: 15%">Notes</th>
                                            <th style="width: 5%"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="detail, stat : *{details}" class="detail-row">
                                            <td>
                                                <select class="form-select form-select-sm ingredient-select"
                                                        th:field="*{details[__${stat.index}__].ingredientId}"
                                                        th:classappend="${#fields.hasErrors('details[__${stat.index}__].ingredientId')} ? 'is-invalid'">
                                                    <option value="">Select...</option>
                                                    <option th:each="ing : ${ingredients}"
                                                            th:value="${ing.id}"
                                                            th:text="${ing.name}"
                                                            th:data-cost="${ing.currentUnitCost}"
                                                            th:data-unit="${ing.unitOfMeasure}">Ingredient</option>
                                                </select>
                                                <div class="invalid-feedback" th:each="err : ${#fields.errors('details[__${stat.index}__].ingredientId')}" th:text="${err}">Error</div>
                                            </td>
                                            <td>
                                                <input type="number" step="0.0001" min="0.0001" max="99999999.9999"
                                                       class="form-control form-control-sm quantity-input"
                                                       th:field="*{details[__${stat.index}__].quantity}"
                                                       th:classappend="${#fields.hasErrors('details[__${stat.index}__].quantity')} ? 'is-invalid'">
                                                <div class="invalid-feedback" th:each="err : ${#fields.errors('details[__${stat.index}__].quantity')}" th:text="${err}">Error</div>
                                            </td>
                                            <td>
                                                <input type="number" step="0.0001" min="0" max="99999999.9999"
                                                       class="form-control form-control-sm unit-cost-input" readonly>
                                                <input type="hidden" class="unit-cost-hidden"
                                                       th:field="*{details[__${stat.index}__].unitCost}">
                                            </td>
                                            <td>
                                                <input type="number" step="0.0001" min="0" max="99999999.9999"
                                                       class="form-control form-control-sm total-cost-input" readonly>
                                                <input type="hidden" class="total-cost-hidden"
                                                       th:field="*{details[__${stat.index}__].totalCost}">
                                            </td>
                                            <td>
                                                <input type="text" class="form-control form-control-sm"
                                                       th:field="*{details[__${stat.index}__].notes}"
                                                       placeholder="Optional">
                                            </td>
                                            <td>
                                                <input type="hidden" th:field="*{details[__${stat.index}__].id}">
                                                <input type="hidden" class="unit-of-measure-hidden"
                                                       th:field="*{details[__${stat.index}__].unitOfMeasure}">
                                                <button type="button" class="btn btn-sm btn-outline-danger remove-detail-btn">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="d-flex justify-content-end mt-3">
                                <div class="text-end">
                                    <span class="text-muted me-3">Production cost:</span>
                                    <strong class="fs-5" id="totalProductionCost">0.00</strong>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-2"></i>
                            <span th:text="${recipe.id} ? 'Update' : 'Create'">Save</span>
                        </button>
                        <a th:href="@{/recipe}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg me-2"></i>Cancel
                        </a>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const ingredients = /*[[${ingredients.content}]]*/ [];
            const table = document.getElementById('detailsTable');
            const tbody = table.querySelector('tbody');
            const addBtn = document.getElementById('addDetailBtn');
            let rowIndex = tbody.querySelectorAll('.detail-row').length;

            function buildIngredientOptions() {
                let html = '<option value="">Select...</option>';
                ingredients.forEach(function(ing) {
                    html += '<option value="' + ing.id + '"'
                        + ' data-cost="' + ing.currentUnitCost + '"'
                        + ' data-unit="' + ing.unitOfMeasure + '">'
                        + ing.name + '</option>';
                });
                return html;
            }

            function recalculateTotal() {
                let total = 0;
                tbody.querySelectorAll('.detail-row').forEach(function(row) {
                    const totalCostHidden = row.querySelector('.total-cost-hidden');
                    if (totalCostHidden && totalCostHidden.value) {
                        total += parseFloat(totalCostHidden.value) || 0;
                    }
                });
                document.getElementById('totalProductionCost').textContent = total.toFixed(4);
            }

            function updateDetailCalculations(row) {
                const select = row.querySelector('.ingredient-select');
                const quantityInput = row.querySelector('.quantity-input');
                const unitCostInput = row.querySelector('.unit-cost-input');
                const unitCostHidden = row.querySelector('.unit-cost-hidden');
                const totalCostInput = row.querySelector('.total-cost-input');
                const totalCostHidden = row.querySelector('.total-cost-hidden');
                const unitOfMeasureHidden = row.querySelector('.unit-of-measure-hidden');

                if (select.value) {
                    const option = select.options[select.selectedIndex];
                    const cost = parseFloat(option.getAttribute('data-cost')) || 0;
                    const unit = option.getAttribute('data-unit') || '';
                    unitCostInput.value = cost.toFixed(4);
                    unitCostHidden.value = cost;
                    unitOfMeasureHidden.value = unit;

                    const quantity = parseFloat(quantityInput.value) || 0;
                    const totalCost = quantity * cost;
                    totalCostInput.value = totalCost.toFixed(4);
                    totalCostHidden.value = totalCost;
                } else {
                    unitCostInput.value = '';
                    unitCostHidden.value = '';
                    totalCostInput.value = '';
                    totalCostHidden.value = '';
                    unitOfMeasureHidden.value = '';
                }
                recalculateTotal();
            }

            function bindRowEvents(row) {
                const select = row.querySelector('.ingredient-select');
                const quantityInput = row.querySelector('.quantity-input');
                const removeBtn = row.querySelector('.remove-detail-btn');

                select.addEventListener('change', function() { updateDetailCalculations(row); });
                quantityInput.addEventListener('input', function() { updateDetailCalculations(row); });
                removeBtn.addEventListener('click', function() {
                    row.remove();
                    recalculateTotal();
                });
            }

            tbody.querySelectorAll('.detail-row').forEach(function(row) {
                bindRowEvents(row);
                const quantityInput = row.querySelector('.quantity-input');
                const select = row.querySelector('.ingredient-select');
                if (quantityInput.value && select.value) {
                    updateDetailCalculations(row);
                }
            });

            addBtn.addEventListener('click', function() {
                const newRow = document.createElement('tr');
                newRow.className = 'detail-row';
                newRow.innerHTML =
                    '<td>'
                    + '<select class="form-select form-select-sm ingredient-select" name="details[' + rowIndex + '].ingredientId">'
                    + buildIngredientOptions()
                    + '</select>'
                    + '</td>'
                    + '<td>'
                    + '<input type="number" step="0.0001" min="0.0001" max="99999999.9999" class="form-control form-control-sm quantity-input" name="details[' + rowIndex + '].quantity">'
                    + '</td>'
                    + '<td>'
                    + '<input type="number" step="0.0001" min="0" max="99999999.9999" class="form-control form-control-sm unit-cost-input" readonly>'
                    + '<input type="hidden" class="unit-cost-hidden" name="details[' + rowIndex + '].unitCost">'
                    + '</td>'
                    + '<td>'
                    + '<input type="number" step="0.0001" min="0" max="99999999.9999" class="form-control form-control-sm total-cost-input" readonly>'
                    + '<input type="hidden" class="total-cost-hidden" name="details[' + rowIndex + '].totalCost">'
                    + '</td>'
                    + '<td>'
                    + '<input type="text" class="form-control form-control-sm" name="details[' + rowIndex + '].notes" placeholder="Optional">'
                    + '</td>'
                    + '<td>'
                    + '<input type="hidden" name="details[' + rowIndex + '].id">'
                    + '<input type="hidden" class="unit-of-measure-hidden" name="details[' + rowIndex + '].unitOfMeasure">'
                    + '<button type="button" class="btn btn-sm btn-outline-danger remove-detail-btn"><i class="bi bi-trash"></i></button>'
                    + '</td>';
                tbody.appendChild(newRow);
                bindRowEvents(newRow);
                rowIndex++;
            });

            tbody.querySelectorAll('.detail-row').forEach(function(row) {
                const removeBtn = row.querySelector('.remove-detail-btn');
                removeBtn.addEventListener('click', function() {
                    row.remove();
                    recalculateTotal();
                });
            });

            recalculateTotal();
        });
    </script>
</body>
</html>
