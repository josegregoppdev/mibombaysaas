<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${supplier.id} ? 'Edit supplier' : 'New supplier'">Supplier — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="mb-dashboard-header">
                    <h1 class="display-6" th:text="${supplier.id} ? 'Edit supplier' : 'New supplier'">Title</h1>
                    <p class="text-muted" th:if="${supplier.isDefault != null and supplier.isDefault}">This is the default supplier (Proveedor Principal). Only name and address can be edited.</p>
                    <p class="text-muted" th:unless="${supplier.isDefault != null and supplier.isDefault}">Complete the form fields</p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="${supplier.id} ? @{/supplier/{id}(id=${supplier.id})} : @{/supplier}"
                              th:object="${supplier}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="name">Name</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                           placeholder="E.g.: San Fernando S.A.">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('name')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="document">Document (NIT)</label>
                                    <input type="text" class="form-control" id="document" th:field="*{document}"
                                           th:classappend="${#fields.hasErrors('document')} ? 'is-invalid'"
                                           th:readonly="${supplier.isDefault != null and supplier.isDefault}"
                                           placeholder="E.g.: 890900000">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('document')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="phone">Phone</label>
                                    <input type="text" class="form-control" id="phone" th:field="*{phone}"
                                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                           th:readonly="${supplier.isDefault != null and supplier.isDefault}"
                                           placeholder="E.g.: +57 300 123 4567">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('phone')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="email">Email</label>
                                    <input type="text" class="form-control" id="email" th:field="*{email}"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                           th:readonly="${supplier.isDefault != null and supplier.isDefault}"
                                           placeholder="E.g.: ventas@proveedor.com">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('email')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="address">Address</label>
                                    <input type="text" class="form-control" id="address" th:field="*{address}"
                                           th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"
                                           placeholder="E.g.: Carrera 10 # 20-30">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('address')}" th:text="${err}">Error</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="contactName">Contact name</label>
                                    <input type="text" class="form-control" id="contactName" th:field="*{contactName}"
                                           th:classappend="${#fields.hasErrors('contactName')} ? 'is-invalid'"
                                           th:readonly="${supplier.isDefault != null and supplier.isDefault}"
                                           placeholder="E.g.: Ana Martinez">
                                    <div class="invalid-feedback" th:each="err : ${#fields.errors('contactName')}" th:text="${err}">Error</div>
                                </div>
                            </div>

                            <div class="row mt-3">
                                <div class="col-md-6">
                                    <div class="form-check form-switch">
                                        <input type="checkbox" class="form-check-input" id="active" th:field="*{active}">
                                        <label class="form-check-label" for="active">Active</label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary" th:disabled="${supplier.isDefault != null and supplier.isDefault and supplier.id != null}">
                                    <i class="bi bi-check-lg"></i>
                                    <span th:text="${supplier.id} ? 'Update' : 'Create'">Save</span>
                                </button>
                                <a th:href="@{/supplier}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-lg"></i>Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
