<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movements — MiBombay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="mb-dashboard">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebarOffcanvas}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 d-none d-md-block mb-sidebar-col">
                <div th:replace="~{fragments/sidebar :: sidebarInline}"></div>
            </div>

            <main class="col-md-9 col-lg-10 mb-main-col">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${message}">Message</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                    <div>
                        <h1 class="display-6">Movements</h1>
                        <p class="text-muted mb-0">Inventory movement history</p>
                    </div>
                </div>

                <!-- Filter Card -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <form th:action="@{/movement}" method="get" class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label" for="filterType">Type</label>
                                <select class="form-select" id="filterType" name="type">
                                    <option value="">All</option>
                                    <option th:each="t : ${types}" th:value="${t}"
                                            th:text="${t.displayName}"
                                            th:selected="${t == selectedType}">Type</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="filterFrom">From</label>
                                <input type="date" class="form-control" id="filterFrom" name="from"
                                       th:value="${from}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="filterTo">To</label>
                                <input type="date" class="form-control" id="filterTo" name="to"
                                       th:value="${to}">
                            </div>
                            <div class="col-md-2 d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-fill">
                                    <i class="bi bi-search"></i>Filter
                                </button>
                                <a th:href="@{/movement}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-lg"></i>
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Date</th>
                                        <th>Type</th>
                                        <th>Item</th>
                                        <th>Stock</th>
                                        <th>Qty</th>
                                        <th>User</th>
                                        <th>Ref</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="m : ${page.content}">
                                        <td th:text="${#temporals.format(m.date, 'dd/MM/yyyy HH:mm')}">01/01/2025 10:00</td>
                                        <td>
                                            <span class="badge"
                                                  th:classappend="${m.type.name() == 'SALE'} ? 'bg-danger' : (${m.type.name() == 'PURCHASE'} ? 'bg-success' : (${m.type.name() == 'RETURN'} ? 'bg-info' : (${m.type.name() == 'SHRINKAGE'} ? 'bg-warning' : 'bg-secondary')))"
                                                  th:text="${m.type.displayName}">Sale</span>
                                        </td>
                                        <td th:text="${m.ingredientName != null ? m.ingredientName : m.productName}" class="fw-medium">
                                            Item
                                        </td>
                                        <td>
                                            <span th:text="${m.previousStock}">0</span>
                                            <i class="bi bi-arrow-right mx-1 text-muted"></i>
                                            <span th:text="${m.newStock}">0</span>
                                        </td>
                                        <td th:text="${m.quantity}">0</td>
                                        <td th:text="${m.userName}">User</td>
                                        <td>
                                            <span th:if="${m.referenceId != null}" class="text-muted">
                                                <i class="bi bi-hash"></i><span th:text="${m.referenceId}">1</span>
                                            </span>
                                            <span th:unless="${m.referenceId != null}">&#8212;</span>
                                        </td>
                                    </tr>
                                    <tr th:if="${page.totalElements == 0}">
                                        <td colspan="7" class="mb-empty">
                                            <i class="bi bi-clock-history"></i>
                                            <p class="fw-medium mt-2">No movements registered</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav th:if="${page.totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/movement(page=0, type=${selectedType}, from=${from}, to=${to})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                            th:classappend="${i == page.number} ? 'active'">
                            <a class="page-link" th:href="@{/movement(page=${i}, type=${selectedType}, from=${from}, to=${to})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/movement(page=${page.totalPages - 1}, type=${selectedType}, from=${from}, to=${to})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
